---
- name: Provision ControlClaw VM with Docker, Node.js, and security hardening
  hosts: localhost
  connection: local
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3

  environment:
    TERM: xterm-256color
    COLORTERM: truecolor

  pre_tasks:
    - name: Enable color terminal for current session
      ansible.builtin.set_fact:
        ansible_env: "{{ ansible_env | combine({'TERM': 'xterm-256color', 'COLORTERM': 'truecolor'}) }}"

    - name: Detect operating system
      ansible.builtin.set_fact:
        is_linux: "{{ ansible_system == 'Linux' }}"
        is_debian_family: "{{ ansible_os_family == 'Debian' }}"
        is_supported_distro: "{{ ansible_distribution in ['Debian', 'Ubuntu'] }}"

    - name: Fail on unsupported non-Linux systems
      ansible.builtin.fail:
        msg: >-
          Unsupported operating system: {{ ansible_system }}.
          This installer supports Linux only.
      when: not is_linux

    - name: Fail on unsupported Linux distribution
      ansible.builtin.fail:
        msg: >-
          Unsupported Linux distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}.
          This installer currently supports Debian and Ubuntu.
      when:
        - is_linux
        - not is_supported_distro

    - name: Display detected OS
      ansible.builtin.debug:
        msg: |
          Detected OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          OS Family: {{ ansible_os_family }}

    # BEFORE the first apt call on the box, and unconditionally.
    #
    # disk-encryption.yml (T-58) used to write this file, with the right reasoning next to it:
    # provisioning races unattended-upgrades and its own earlier tasks, and two runs in three died
    # on `Could not get lock /var/lib/dpkg/lock-` at `Install redsocks` or `Install python venv`.
    # But that file only runs `when: disk_encryption | bool`, and `disk_encryption` defaults to
    # false and is not set by the control plane — so on every box built today the fix was skipped
    # and the failure it describes was still live. Seen twice in a row on a fresh firewall box:
    # `controlclaw : Install python venv + pip tooling` (exit 2), nothing else wrong with the box.
    #
    # Here rather than in the role, because this is the first place early enough to cover
    # `Update apt cache and upgrade all packages` below — the longest apt call of the run, and the
    # one most likely to be holding the lock the next task wants.
    - name: apt waits for the dpkg lock rather than failing on it
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99-controlclaw-lock-timeout
        owner: root
        group: root
        mode: '0644'
        content: |
          // Managed by ControlClaw. Wait up to five minutes for the dpkg lock.
          DPkg::Lock::Timeout "300";
      when: is_debian_family

    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600
      when: is_debian_family and not ci_test
      register: apt_upgrade_result

    - name: Install ACL for privilege escalation
      ansible.builtin.package:
        name: acl
        state: present
      when: is_supported_distro

    - name: Check if running as root
      ansible.builtin.command: id -u
      register: user_id
      changed_when: false
      become: false

    - name: Set fact for root user
      ansible.builtin.set_fact:
        is_root: "{{ user_id.stdout == '0' }}"

  roles:
    - controlclaw

  post_tasks:
    - name: Create cloud-init completion marker
      ansible.builtin.file:
        path: /root/cloud-init-done
        state: touch
        mode: '0644'

    - name: Provisioning complete
      ansible.builtin.debug:
        msg: "ControlClaw VM provisioning complete!"
