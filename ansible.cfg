[defaults]
roles_path = ./roles
# Print a ranked per-task timing summary at the end of every run. Provisioning is ~7 minutes and
# cloud-init only reports one opaque `config-scripts_user` bucket for the whole thing, so without
# this there is no way to tell which task is costing the time. The output lands in
# /var/log/cloud-init-output.log on the box.
callbacks_enabled = ansible.posix.profile_tasks

[callback_profile_tasks]
# 30, because that is what a "where did the provision go" reading of a run actually needs: the
# tail below 25 was where the first-boot fast path's savings were hiding (controlclaw T-98).
task_output_limit = 30

[connection]
# The play is `connection: local`, and the local connection plugin declares `has_pipelining`
# (ansible-core 2.16). Without it every one of the ~330 tasks of an agent provision writes its
# module to a temp file, chmods it, execs it and deletes it; with it the module goes to the
# interpreter on stdin. Nothing else about the run changes, and a connection plugin that did not
# support it would simply ignore the setting.
pipelining = True
