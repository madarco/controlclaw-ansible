# The role's rust-runtime.yml for the agent, then the folder it chose, in /tmp/cc_rust_dir.
- hosts: localhost
  connection: local
  gather_facts: true
  vars:
    box_role: openclaw
    vm_id: vm_test
  tasks:
    - name: The runtime step, as vm-agent.yml includes it
      ansible.builtin.include_role:
        name: controlclaw
        tasks_from: rust-runtime
      vars:
        rust_components:
          - unit: controlclaw-agent
            bin: vm-agent
            migrate_role: agent
    - name: What it chose
      ansible.builtin.copy:
        dest: /tmp/cc_rust_dir
        content: "{{ cc_rust_dir }}"
