# The role's rust-runtime.yml for the firewall agent, then the folder it chose, in /tmp/cc_rust_dir.
- hosts: localhost
  connection: local
  gather_facts: true
  vars:
    box_role: mitm
    vm_id: fw_test
    org_id: org_test
  tasks:
    - name: The runtime step, as mitmbox.yml includes it
      ansible.builtin.include_role:
        name: controlclaw
        tasks_from: rust-runtime
      vars:
        rust_components:
          - unit: controlclaw-mitm-agent
            bin: mitm-agent
            migrate_role: firewall
    - name: The cleanup, as the includers run it after the daemon-reload
      ansible.builtin.include_role:
        name: controlclaw
        tasks_from: rust-runtime-cleanup
    - name: What it chose
      ansible.builtin.copy:
        dest: /tmp/cc_rust_dir
        content: "{{ cc_rust_dir }}"
