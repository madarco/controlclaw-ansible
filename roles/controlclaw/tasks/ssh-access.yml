---
# Rescue shell access (apps/saas/docs/features/shell-access.md).
#
# A grant is full root on this box, and only while the grant is open (T-70). Two things carry that:
# a login account that exists for nothing else, and a sudoers drop-in that is written when the
# window opens and removed when it ends.
#
# `ccsupport`, NOT `controlclaw`, is the account a session lands in. The vm-agent (and on the
# firewall box the mitm-agent) runs as `controlclaw`, and that account's sudo is deliberately
# scoped — the list in user.yml is the agent's own needs, nothing more. Handing `NOPASSWD: ALL` to
# that uid for a day or three would hand it to the agent process too: any hole in an internet-facing
# daemon would be root for the length of the window, and a drop-in that failed to come off would
# leave it root for good. `ccsupport` runs nothing. Outside a window it has no key, no password and
# no way in, so the same drop-in left behind by a botched close grants nobody anything.
#
# The private half of the key is still minted on the box and never written to its disk. What root
# is handed here is the PUBLIC half, on stdin — that is not a secret, and it is the only way to put
# a key in a home directory the agent must not be able to write.

# The account. System user, no password, and nothing ever runs as it: a shell here is a person.
- name: Rescue shell access | the support login account
  ansible.builtin.user:
    name: ccsupport
    comment: "ControlClaw support rescue login"
    system: true
    shell: /bin/bash
    create_home: true
    home: /home/ccsupport
    password_lock: true
    state: present

# 0700 and owned by `ccsupport` — so `controlclaw` cannot write it, and sshd's StrictModes is
# satisfied (it wants the account's own .ssh owned by that account, not by root). That is the
# whole reason the key install goes through cc-ssh-open instead of being done by the agent:
# an account that gets root for the window must not have an authorized_keys the agent can append to
# quietly, outside the one script that also opens the port, arms the timer and says so in the
# journal.
- name: Rescue shell access | the support account's .ssh
  ansible.builtin.file:
    path: /home/ccsupport/.ssh
    state: directory
    owner: ccsupport
    group: ccsupport
    mode: "0700"

- name: Rescue shell access | the open script
  ansible.builtin.copy:
    dest: /usr/local/bin/cc-ssh-open
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # cc-ssh-open <seconds> — give ccsupport root, let its key in, open 22, arm the timer.
      # The public key is read from STDIN. The private half never comes near this script.
      set -euo pipefail
      SECONDS_ARG="${1:-}"
      [[ "$SECONDS_ARG" =~ ^[0-9]+$ ]] || { echo "usage: cc-ssh-open <seconds>  (public key on stdin)" >&2; exit 2; }
      # Bounded here as well as in the agent: root must not take an unbounded window from a
      # process that has been taken over.
      if [ "$SECONDS_ARG" -lt 300 ] || [ "$SECONDS_ARG" -gt 259200 ]; then
        echo "cc-ssh-open: window must be between 300 and 259200 seconds" >&2
        exit 2
      fi

      SUPPORT_USER=ccsupport
      KEYS=/home/ccsupport/.ssh/authorized_keys
      DROPIN=/etc/sudoers.d/controlclaw-support-root

      # One line, one key, one shape. An authorized_keys line can carry options — `command=`,
      # `environment=`, a second key after a newline — and this is the input to an account that is
      # about to have root, so nothing but a bare ed25519 key with the rescue marker is accepted.
      # The marker is required, not optional: cc-ssh-close removes keys BY that marker, and a key
      # installed without one would survive the close that is supposed to end this.
      #
      # Whole of stdin, deliberately NOT `head -n 1`. Taking the first line and ignoring the rest
      # would quietly accept input carrying a second key and install half of it; the regex has no
      # multiline flag, so an embedded newline fails to match and the whole thing is refused
      # instead. The byte cap is far above one key and only stops an unbounded read.
      PUBKEY=$(head -c 1024 | tr -d '\r')
      if ! [[ "$PUBKEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+=*\ controlclaw-rescue-[A-Za-z0-9_-]{1,64}$ ]]; then
        echo "cc-ssh-open: stdin must be exactly one ed25519 public key with a controlclaw-rescue marker" >&2
        exit 2
      fi

      # Nothing half-open. Every step below either all happens or none of it is left behind: a box
      # that reported a failed open must not be sitting there with a root grant, or a key, or 22.
      # All four, not just the first two — the agent turns a failure here into a failed grant, and
      # the control plane does not queue an ssh.close for a grant that never opened, so anything
      # this leaves behind is left behind until some unrelated later grant closes it. Each step is
      # best effort: undo runs while something has already gone wrong.
      undo() {
        rm -f "$DROPIN" "$KEYS"
        ufw delete allow 22/tcp >/dev/null 2>&1 || true
        systemctl stop cc-ssh-close.timer >/dev/null 2>&1 || true
      }
      trap undo ERR

      # Root first, because it is the part that must never outlive the rest. `visudo -cf` on the
      # candidate before it is anywhere sudo reads: a syntax error in /etc/sudoers.d does not break
      # one rule, it breaks sudo, and on a box whose whole recovery story is `sudo` that is the one
      # mistake there is no way back from.
      tmp=$(mktemp)
      cat > "$tmp" <<EOF
      # ControlClaw support shell access, for the length of one grant (T-70). Written by
      # cc-ssh-open and removed by cc-ssh-close, the expiry timer, cc-ssh-close-at-boot and a
      # revoke. If you are reading this outside a window, something failed to clean up: remove it.
      # ccsupport runs nothing and has no password, so this is inert without a key in
      # /home/ccsupport/.ssh/authorized_keys.
      $SUPPORT_USER ALL=(ALL) NOPASSWD: ALL
      EOF
      if ! visudo -cf "$tmp" >/dev/null; then
        rm -f "$tmp"
        echo "cc-ssh-open: refusing to install a sudoers file that does not parse" >&2
        exit 1
      fi
      install -o root -g root -m 0440 "$tmp" "$DROPIN"
      rm -f "$tmp"

      # The key. Replaced wholesale rather than appended: this account has exactly one key at a
      # time, and it is this grant's.
      install -d -o "$SUPPORT_USER" -g "$SUPPORT_USER" -m 0700 /home/ccsupport/.ssh
      tmp=$(mktemp)
      printf '%s\n' "$PUBKEY" > "$tmp"
      install -o "$SUPPORT_USER" -g "$SUPPORT_USER" -m 0600 "$tmp" "$KEYS"
      rm -f "$tmp"

      ufw allow 22/tcp >/dev/null
      cat > /etc/systemd/system/cc-ssh-close.service <<'UNIT'
      [Unit]
      Description=Close ControlClaw rescue shell access
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/cc-ssh-close
      UNIT
      cat > /etc/systemd/system/cc-ssh-close.timer <<UNIT
      [Unit]
      Description=Close ControlClaw rescue shell access when the window ends
      [Timer]
      OnActiveSec=${SECONDS_ARG}
      AccuracySec=30s
      Unit=cc-ssh-close.service
      UNIT
      systemctl daemon-reload
      # Restarted, not started: a second grant must reset the clock rather than inherit the first
      # one's deadline.
      systemctl restart cc-ssh-close.timer
      trap - ERR
      # The success line is a CONTRACT, not a log line. Both agents refuse to report a grant open
      # unless they see `key=installed` in it. Before T-70 the agent wrote authorized_keys itself
      # and this script only opened the port, so a box still running the old script would ignore
      # the key on stdin, install nothing, open 22 and exit 0 — and the control plane would seal a
      # key, email the owners and hand support an `ssh` line that could never log in, with no
      # error anywhere. Bundles are hand-staged and ansible-pull is once-per-instance, so that
      # pairing is not hypothetical. Keep the token if you reword the sentence.
      echo "cc-ssh-open: OK root=${SUPPORT_USER} key=installed window=${SECONDS_ARG}s"

- name: Rescue shell access | the close script
  ansible.builtin.copy:
    dest: /usr/local/bin/cc-ssh-close
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # cc-ssh-close — take root away, remove every ControlClaw-managed key, shut the port.
      # No arguments. Safe to run when nothing is open; the timer and the boot unit run it
      # unattended. Deliberately NOT `set -e`: every step here is a revoke, and one that cannot be
      # done must not stop the others.
      set -uo pipefail

      # Root goes first and unconditionally. It is the new thing a grant hands out, it is one file,
      # and removing it is the step least likely to fail — so it is the one that should not be
      # waiting behind anything else.
      rm -f /etc/sudoers.d/controlclaw-support-root
      # A report, not a gate: removing a file cannot break sudoers, so a complaint here means
      # something else on this box already did, and a rescue box with broken sudo has to say so
      # loudly rather than in nobody's log.
      visudo -c >/dev/null 2>&1 || echo "cc-ssh-close: WARNING /etc/sudoers no longer validates" >&2

      # Both accounts. ccsupport is where a key goes now; /home/controlclaw is where it went before
      # T-70, and a box upgraded mid-grant has one sitting there that nothing else would remove.
      strip() {
        local keys="$1" owner="$2" tmp
        [ -f "$keys" ] || return 0
        # The same marker packages/vm-agent/src/ssh.ts writes. Anything without it is the
        # customer's own key and is left alone.
        tmp=$(mktemp)
        grep -v 'controlclaw-rescue' "$keys" > "$tmp" || true
        install -o "$owner" -g "$owner" -m 0600 "$tmp" "$keys"
        rm -f "$tmp"
      }
      strip /home/ccsupport/.ssh/authorized_keys ccsupport
      strip "/home/{{ controlclaw_user | default('controlclaw') }}/.ssh/authorized_keys" "{{ controlclaw_user | default('controlclaw') }}"

      ufw delete allow 22/tcp >/dev/null 2>&1 || true
      systemctl stop cc-ssh-close.timer >/dev/null 2>&1 || true
      rm -f /opt/controlclaw/state/ssh.json

      # LAST: end every live ccsupport session, and everything in it.
      #
      # Removing the drop-in stops the NEXT sudo — sudo re-reads /etc/sudoers.d on every call, so
      # no shell keeps the ability to escalate. What it does not stop is a process that escalated
      # while the window was open: `sudo -i` left running, a backgrounded root job, the server end
      # of an ssh -M master. Those keep uid 0 for as long as they live, which on a 72-hour grant
      # can be indefinitely — and "it ends by itself" is the promise this whole feature is built
      # on. So the window ends the sessions too.
      #
      # Three mechanisms, because no one of them covers the case that matters on its own.
      #
      #   1. `loginctl terminate-user` — the logind session scope. A process that ran `sudo` stays
      #      in the scope of the session it was started from even though its uid is now 0, so this
      #      is what ends `sudo -i` on a box with logind, which is every box we build.
      #   2. The loginuid sweep — the same job without logind, and the one that is actually
      #      load-bearing. pam_loginuid stamps /proc/<pid>/loginuid at login and the kernel does
      #      not let it change afterwards, not even across setuid, so "descended from a ccsupport
      #      login" survives the escalation that `pkill -u ccsupport` loses track of. Tested: with
      #      only terminate-user and pkill, a `sudo -n sleep` started in the window outlives the
      #      close.
      #   3. `pkill -KILL -u ccsupport` — anything still running AS ccsupport that neither caught.
      #
      # Detached with systemd-run, because support can run this from inside a ccsupport session
      # themselves: killing the session would otherwise kill the script before it printed, and on
      # a box where systemd-run is missing the direct call is still correct — everything above has
      # already happened by then, which is why this is last.
      END_SESSIONS='
        loginctl terminate-user ccsupport >/dev/null 2>&1 || true
        sleep 2
        CCUID=$(id -u ccsupport 2>/dev/null) || CCUID=""
        if [ -n "$CCUID" ]; then
          for d in /proc/[0-9]*; do
            [ -r "$d/loginuid" ] || continue
            [ "$(cat "$d/loginuid" 2>/dev/null)" = "$CCUID" ] || continue
            kill -KILL "${d#/proc/}" 2>/dev/null || true
          done
        fi
        pkill -KILL -u ccsupport >/dev/null 2>&1 || true
      '
      if command -v systemd-run >/dev/null 2>&1; then
        systemd-run --collect --unit=cc-ssh-logout /bin/sh -c "$END_SESSIONS" >/dev/null 2>&1 \
          || /bin/sh -c "$END_SESSIONS"
      else
        /bin/sh -c "$END_SESSIONS"
      fi
      echo "cc-ssh-close: root revoked, keys removed, 22 closed, ccsupport sessions ended"

- name: Rescue shell access | sudoers for the two scripts
  ansible.builtin.copy:
    dest: /etc/sudoers.d/controlclaw-ssh
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -csf %s
    content: |
      # Rescue shell access. The agent asks root for the window, the port and the timer, and hands
      # it the PUBLIC half of a key it just minted. It cannot name the account that gets root
      # (cc-ssh-open hardcodes ccsupport), cannot reach that account's home, and cannot run
      # anything as it — so a grant it triggers by itself is a grant it still has to log in to use,
      # and every such login is on the owner's Activity page whether a grant exists or not.
      {{ controlclaw_user | default('controlclaw') }} ALL=(root) NOPASSWD: /usr/local/bin/cc-ssh-open, /usr/local/bin/cc-ssh-close

- name: Rescue shell access | the boot unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/cc-ssh-close-at-boot.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Close any ControlClaw rescue shell access left over from before a reboot
      After=network.target
      # Before the agent, because the agent is what tells the control plane (T-63). It reports its
      # own view of this box's rescue session when it reports ready, and a report that beat this
      # unit would say "still open" about a session this unit is about to end — which is exactly
      # how a grant came to sit "open" in the console for the rest of its window after a reboot.
      # Naming a unit that does not exist on this box (only one of the two ever does) is a no-op.
      Before=controlclaw-agent.service controlclaw-mitm-agent.service
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/cc-ssh-close
      [Install]
      WantedBy=multi-user.target
  notify: reload systemd

- name: Rescue shell access | shut the door on every boot
  # A box that was rebooted mid-grant comes back with its key still in authorized_keys, the root
  # drop-in still in /etc/sudoers.d and no timer (timers do not survive a reboot). Closing at boot
  # is the fail-safe: the customer's window is not extended by a restart. The grant is over at that
  # point and does not come back — the control plane learns it from the agent's next ready report
  # and shows it as closed, rather than re-opening a door across an event nobody asked for (T-63).
  ansible.builtin.systemd:
    name: cc-ssh-close-at-boot
    enabled: true
    daemon_reload: true

# Belt to the braces for a box that is re-provisioned while nothing is open: ansible-pull runs on
# every self-update, and a drop-in still sitting there from a window that ended badly — a close
# that could not run, a disk that came back from a snapshot — would otherwise be a standing root
# grant nobody asked for. Skipped while a grant IS open, because ending somebody's live session is
# not this task's business.
- name: Rescue shell access | no standing root grant outside a window
  ansible.builtin.shell: |
    set -e
    if [ -f /etc/sudoers.d/controlclaw-support-root ] && ! systemctl is-active --quiet cc-ssh-close.timer; then
      rm -f /etc/sudoers.d/controlclaw-support-root
      echo removed
    else
      echo nothing-to-do
    fi
  register: cc_support_root_stale
  changed_when: "'removed' in cc_support_root_stale.stdout"
