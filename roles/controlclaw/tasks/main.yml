---
# box_role selects what this box is:
#   openclaw (default) - agent box: docker, node, vm-agent, OpenClaw gateway, Caddy in front
#   proxy              - the blind L4 proxy in front of every agent box (HAProxy)
#   mitm               - per-org egress proxy / secret zone
# system tools, the service user and the firewall apply to every role.

# Node does not read the OS trust store. Once the box is confined to the org mitm proxy, every
# npm/pnpm call fails the TLS handshake and then HANGS with no error (25 minutes on one task, real
# box 2026-09-18) unless NODE_EXTRA_CA_CERTS points at the proxy CA. The CA is installed at runtime
# by the vm-agent, so it is absent on the first provision (egress is still direct then) and present
# on every re-run. Look for it once here and hand the variable to the npm/pnpm tasks below.
- name: Look for the org mitm CA in the trust store
  ansible.builtin.stat:
    path: "{{ mitm_ca_path }}"
  register: mitm_ca_installed

- name: Build the node TLS environment for npm/pnpm tasks
  ansible.builtin.set_fact:
    controlclaw_node_env: "{{ {'NODE_EXTRA_CA_CERTS': mitm_ca_path} if mitm_ca_installed.stat.exists else {} }}"

- name: Include system tools installation tasks
  ansible.builtin.include_tasks: system-tools.yml

- name: Include Tailscale installation tasks
  ansible.builtin.include_tasks: tailscale-linux.yml
  when: tailscale_enabled | bool

- name: Include user creation tasks
  ansible.builtin.include_tasks: user.yml

- name: Include Docker installation tasks
  ansible.builtin.include_tasks: docker-linux.yml
  when: not ci_test and box_role != 'proxy'

- name: Include firewall configuration tasks
  ansible.builtin.include_tasks: firewall-linux.yml
  when: not ci_test

- name: Include Node.js installation tasks
  ansible.builtin.include_tasks: nodejs.yml
  when: box_role != 'proxy'

# Before the browser: the live browser is what makes a swapless 4 GB box a problem, and a box
# that has already started Chrome is a bad moment to be allocating a swap file.
- name: Include swap tasks
  ansible.builtin.include_tasks: swap.yml
  when: swap_size_mb | int > 0 and box_role == 'openclaw' and not ci_test

- name: Include browser streaming tasks
  ansible.builtin.include_tasks: browser-stream.yml
  when: browser_stream_enabled | bool and box_role == 'openclaw'

# Egress wiring runs BEFORE the vm-agent starts: the agent's bootstrap reads the
# `keys/mitm_box_private_ip` marker written here to decide whether to wait for the mitm box, install
# its CA and enable the redirect before reporting ready. Starting the agent first let it report
# ready on an unconfined box, after which the control plane locked it down with no proxy path.
- name: Include OpenClaw egress wiring (route through the org mitm box)
  ansible.builtin.include_tasks: openclaw-egress.yml
  when:
    - box_role == 'openclaw'
    - mitm_box_private_ip | default('') | length > 0

- name: Include VM agent tasks (OpenClaw box)
  ansible.builtin.include_tasks: vm-agent.yml
  when: vm_id is defined and box_role == 'openclaw'

- name: Include OpenClaw gateway install (systemd unit the vm-agent drives)
  ansible.builtin.include_tasks: openclaw.yml
  when: vm_id is defined and box_role == 'openclaw'

- name: Include Caddy (TLS termination + auth shim in front of OpenClaw)
  ansible.builtin.include_tasks: caddy.yml
  when: box_role == 'openclaw'

# Lets a later fix reach this box without rebuilding it. Pins what a re-run is allowed to pull,
# so the control plane can ask for an update but never choose the code.
- name: Include on-demand re-provisioning (pin + cc-reprovision)
  ansible.builtin.include_tasks: self-update.yml
  when: box_role == 'openclaw'

- name: Include proxy box tasks (blind L4 proxy)
  ansible.builtin.include_tasks: proxy.yml
  when: box_role == 'proxy'

- name: Include mitm box tasks (secret zone)
  ansible.builtin.include_tasks: mitmbox.yml
  when: box_role == 'mitm'
