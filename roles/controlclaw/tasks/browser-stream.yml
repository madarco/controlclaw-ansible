---
# The live browser: Chrome on an Xvfb display, shown over x11vnc + noVNC and driven by OpenClaw
# over CDP. On by default (defaults/main.yml); the console reaches noVNC through Caddy only.

- name: Install browser streaming dependencies
  ansible.builtin.apt:
    name:
      - xvfb
      - x11vnc
      - novnc
      - websockify
      - fonts-liberation
      - fonts-noto-color-emoji
      # No window manager meant Chrome's own dialogs, popups and <select> menus opened
      # unmapped or unfocused. openbox is ~1MB and makes the session behave like a desktop.
      - openbox
      # certutil: Chrome reads its own NSS database, not /etc/ssl/certs, so cc-install-ca
      # (openclaw-egress.yml) needs this to put the org mitm CA where Chrome will find it.
      - libnss3-tools
      # apparmor_parser, for the Chrome sandbox profile below. Present on a stock Ubuntu cloud
      # image, named here because the sandbox depends on it and nothing else in the role does.
      - apparmor
      - python3
    state: present
    update_cache: true

# Chrome comes from Google's apt repository, not a downloaded .deb. The .deb declares
# `libasound2 (>= 1.0.17)`, and Ubuntu 24.04 renamed that package to `libasound2t64` for the
# 64-bit time_t transition. The rename carries a versioned `Provides: libasound2 (= 1.2.11-…)`,
# which apt resolves and plain dpkg does not — so `apt: deb:` failed on every real box with
# "Dependency is not satisfiable: libasound2 (>= 1.0.17)" (box vnc-live-2, 2026-09-20) and the
# browser stack never installed. Going through the repository also means Chrome gets security
# updates from unattended-upgrades, and it matches how the role installs Caddy, Docker and Node.
- name: Download the Google Chrome apt repository key
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /usr/share/keyrings/google-chrome.asc
    mode: '0644'

- name: Dearmor the Google Chrome apt repository key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /usr/share/keyrings/google-chrome.gpg /usr/share/keyrings/google-chrome.asc
    creates: /usr/share/keyrings/google-chrome.gpg

- name: Add the Google Chrome apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main"
    filename: google-chrome
    state: present

- name: Install Google Chrome stable
  ansible.builtin.apt:
    name: google-chrome-stable
    state: present
    update_cache: true

# The renderer is where LLM-chosen web content is parsed, in a browser that holds the customer's
# saved logins and runs as the user that owns the gateway token and the cc-install-ca sudo rule.
# It has to be sandboxed, and the sandbox has to be verified rather than assumed.
#
# Chrome's first sandbox layer needs an unprivileged user namespace. Ubuntu 24.04 refuses those
# to any binary without an AppArmor profile granting `userns`
# (kernel.apparmor_restrict_unprivileged_userns=1) — which is the reason people reach for
# --no-sandbox and the reason it was in this script. The package ships exactly the right profile,
# but parks it under /opt and only copies it out from its own postinst when the apparmor
# userspace happens to already be installed. Do it here instead, so it does not depend on the
# order two packages were installed in, or on a base image built before apparmor was.
- name: Look for the AppArmor profile shipped with Chrome
  ansible.builtin.stat:
    path: /opt/google/chrome/apparmor.d/google-chrome-stable
  register: chrome_apparmor_src

- name: Install Chrome's AppArmor profile
  ansible.builtin.copy:
    src: /opt/google/chrome/apparmor.d/google-chrome-stable
    dest: /etc/apparmor.d/google-chrome-stable
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  when: chrome_apparmor_src.stat.exists
  register: chrome_apparmor

- name: Load Chrome's AppArmor profile
  ansible.builtin.command:
    cmd: apparmor_parser -r -T -W /etc/apparmor.d/google-chrome-stable
  when: chrome_apparmor is changed and not ci_test
  changed_when: true

# The second layer is the setuid helper, which needs no namespaces at all and is the fallback
# when the first is unavailable. It is only usable if the package's SUID bit survived; a box
# where it has not is one where Chrome would silently drop to no sandbox at all.
- name: Check the Chrome setuid sandbox helper
  ansible.builtin.stat:
    path: /opt/google/chrome/chrome-sandbox
  register: chrome_setuid

- name: Fail when neither Chrome sandbox layer is available
  ansible.builtin.assert:
    that:
      - chrome_setuid.stat.exists
      - chrome_setuid.stat.mode == '4755'
      - chrome_setuid.stat.pw_name == 'root'
    fail_msg: >-
      /opt/google/chrome/chrome-sandbox is missing or not setuid root
      (found {{ chrome_setuid.stat.mode | default('absent') }}). Chrome would run its renderers
      unsandboxed, as the user that owns the gateway token and the saved-login profile.

# The password for the second VNC mirror, the one OpenClaw attaches to for its Systems tab.
# Generated once and never rotated, like the gateway token: ansible-pull re-runs on every boot,
# and a rotation would leave OpenClaw's config pointing at the old secret until the next patch.
#
# BOTH FILES IN ONE TASK, and that is not tidiness. x11vnc reads an obfuscated format and
# OpenClaw reads plaintext, so the same 8 characters have to be written twice -- and two tasks
# with two independent guards can each decide differently. Delete one of the pair (the obvious
# thing to do when re-rolling) and a split pair re-rolls the plaintext while x11vnc keeps
# serving the old password: the play stays green, the RFB probe below still sees VncAuth, and
# the only symptom is a customer opening Systems and being told authentication failed.
#
# 8 characters because that is all the RFB password scheme carries -- x11vnc and every client
# truncate to 8, so a longer secret would be a longer string and not a longer password.
#
# Written to .tmp and moved, so an interrupted run leaves no half-written file that the
# existence check below would then accept forever.
#
# This file runs before vm-agent.yml and openclaw-egress.yml, both of which also create the keys
# dir, so it creates its own.
- name: Ensure the keys dir exists (browser-stream runs before the vm-agent tasks)
  ansible.builtin.file:
    path: /opt/controlclaw/keys
    state: directory
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0750'
  when: openclaw_desktop_enabled | bool

- name: Look for both halves of the desktop VNC password
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ openclaw_desktop_password_file }}"
    - "{{ browser_desktop_rfbauth_file }}"
  register: desktop_vnc_files
  when: openclaw_desktop_enabled | bool

# Deliberately NOT no_log. The password never appears in the command string (it is a shell
# variable) nor in the output, so no_log would hide nothing except the failure -- which is
# exactly the trap openclaw.yml documents further down, where a broken task said only
# "censored" and cost a whole box build.
- name: Generate the desktop VNC password, in both the formats that read it
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      umask 077
      pw="$(openssl rand -base64 6)"
      printf '%s' "$pw" > {{ openclaw_desktop_password_file }}.tmp
      x11vnc -storepasswd "$pw" {{ browser_desktop_rfbauth_file }}.tmp >/dev/null
      mv {{ openclaw_desktop_password_file }}.tmp {{ openclaw_desktop_password_file }}
      mv {{ browser_desktop_rfbauth_file }}.tmp {{ browser_desktop_rfbauth_file }}
  when:
    - openclaw_desktop_enabled | bool
    - desktop_vnc_files.results | rejectattr('stat.exists') | list | length > 0 or
      desktop_vnc_files.results | selectattr('stat.size', 'defined') | selectattr('stat.size', 'eq', 0) | list | length > 0
  changed_when: true

- name: Secure both halves of the desktop VNC password
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0600'
  loop:
    - "{{ openclaw_desktop_password_file }}"
    - "{{ browser_desktop_rfbauth_file }}"
  when: openclaw_desktop_enabled | bool

- name: Deploy browser-stream script
  ansible.builtin.copy:
    src: browser-stream.sh
    dest: /usr/local/bin/browser-stream.sh
    owner: root
    group: root
    mode: '0755'
  register: browser_stream_script

- name: Create browser-stream systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/browser-stream.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Browser Streaming (Chromium + noVNC)
      After=network.target
      # OpenClaw attaches to this Chrome over CDP and never launches one of its own
      # (browser.attachOnly), so Chrome has to be listening first.
      Before=openclaw.service

      [Service]
      Type=simple
      User={{ controlclaw_user }}
      ExecStart=/usr/local/bin/browser-stream.sh
      Restart=always
      RestartSec=10
      Environment=HOME={{ controlclaw_home }}
      Environment=DISPLAY=:1
      Environment=CONTROLCLAW_BROWSER_CDP_PORT={{ browser_cdp_port }}
      Environment=CONTROLCLAW_BROWSER_VNC_PORT={{ browser_vnc_port }}
      Environment=CONTROLCLAW_BROWSER_NOVNC_PORT={{ browser_novnc_port }}
      Environment=CONTROLCLAW_BROWSER_GEOMETRY={{ browser_screen_geometry }}
      # The second, password-protected mirror of the same display, which OpenClaw attaches to
      # for its Systems tab. An empty RFBAUTH is how the script is told not to start it.
      Environment=CONTROLCLAW_BROWSER_DESKTOP_VNC_PORT={{ browser_desktop_vnc_port }}
      Environment=CONTROLCLAW_BROWSER_DESKTOP_RFBAUTH={{ browser_desktop_rfbauth_file if openclaw_desktop_enabled | bool else '' }}

      # A browser is the one process here whose appetite is set by whatever page someone opens,
      # and it shares a 4 GB box with the agent. Left alone the kernel picks the victim on its
      # own and usually takes OpenClaw, so the agent dies and the browser that caused it looks
      # fine. Cap the whole browser cgroup instead: MemoryHigh throttles and pushes it to swap,
      # MemoryMax is the wall, and Restart=always brings the display back afterwards.
      # OOMScoreAdjust makes it the preferred victim of a whole-box OOM too.
      MemoryAccounting=true
      MemoryHigh={{ browser_memory_high }}
      MemoryMax={{ browser_memory_max }}
      OOMScoreAdjust=500

      [Install]
      WantedBy=multi-user.target
  register: browser_stream_unit

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start browser-stream service
  ansible.builtin.systemd:
    name: browser-stream
    state: started
    enabled: true

# `state: started` leaves an already-running browser alone, so without this a re-provision drops
# a new script on the box and the old Chrome keeps running until something reboots it — and the
# assertion below, which reads the RUNNING process, then fails against flags that were never
# applied. Restarted here rather than from a handler because handlers run at the end of the play,
# after that assertion.
#
# The trigger is the running command line, not only `changed`: `copy` reports changed exactly
# once, so a run that writes a new script and is then interrupted before the restart (an
# ansible-pull that times out, a control-plane retry) would leave every later run seeing an
# unchanged file, skipping the restart, and failing the assertion forever. Reading what is
# actually running is self-healing. It costs the customer their open tabs, so it fires only when
# the script changed or the flags really are stale.
# The pattern is anchored at the binary path on purpose. `pgrep -f` matches the WHOLE command
# line of every process, and this task's own shell carries the pattern as an argument, so an
# unanchored `google-chrome-stable --remote-debugging` matches the wrapper as happily as Chrome
# — which on a box where Chrome has not come up yet reads as "a browser is running" and then
# asserts against the wrapper's arguments. Chrome's cmdline starts with the binary; no shell's
# does.
- name: Read the running browser's flags before deciding on a restart
  ansible.builtin.command:
    cmd: pgrep -a -f "^/usr/bin/google-chrome-stable --remote-debugging"
  register: browser_cmdline_now
  changed_when: false
  failed_when: false
  when: not ci_test

# One script, asked twice (before and after a restart), so it lives in a fact rather than being
# spelled out twice. It mirrors OpenClaw's own reader: reply with the version the server
# offered rather than assuming 3.8, read the 4-byte security word on RFB < 3.7 and the
# 1-byte-count list otherwise, and report the FIRST type OpenClaw would recognise, because
# `classifyRfbSecurity` returns on that one and judges the server by it.
#
# It waits inside the script rather than through `retries`/`until`. An ansible loop that runs
# out of retries marks its task failed whatever `failed_when` says — the flag is evaluated
# inside the loop and the exhaustion is stamped after it — so a task that reads "this cannot
# fail" would have taken the whole provision down when the mirror was slow. Waiting here, the
# task always exits 0 and the caller reads the answer.
- name: Build the RFB probe
  ansible.builtin.set_fact:
    desktop_vnc_probe_script: |
      python3 - <<'PY'
      import socket, time
      KNOWN = {1, 2, 30, 6, 16, 19, 22, 113}
      DEADLINE = time.monotonic() + 60

      def look():
          sock = socket.create_connection(("127.0.0.1", {{ browser_desktop_vnc_port }}), 5)
          try:
              def read(count):
                  buf = b""
                  while len(buf) < count:
                      chunk = sock.recv(count - len(buf))
                      if not chunk:
                          break
                      buf += chunk
                  return buf

              banner = read(12)
              if len(banner) < 12 or not banner.startswith(b"RFB 003."):
                  return 0, "not-rfb"
              minor = int(banner[8:11])
              sock.sendall(b"RFB 003.008\n" if minor > 7 else b"RFB 003.007\n" if minor == 7 else b"RFB 003.003\n")
              if minor < 7:
                  word = int.from_bytes(read(4), "big")
                  offered = [word] if word else []
              else:
                  count = read(1)
                  offered = list(read(count[0])) if count else []
              return next((k for k in offered if k in KNOWN), 0), ",".join(str(k) for k in offered) or "none"
          finally:
              sock.close()

      while True:
          try:
              first, offered = look()
          except OSError as err:
              # A closed or silent port is an answer, not a crash. browser-stream starts this
              # mirror last, after it has waited for Chrome's renderer, so a fresh box spends a
              # few seconds here.
              first, offered = 0, type(err).__name__
          if first == 2 or time.monotonic() >= DEADLINE:
              break
          time.sleep(2)
      print("VNCSEC=%d OFFERED=%s" % (first, offered))
      PY
  when:
    - not ci_test
    - openclaw_desktop_enabled | bool

# The desktop mirror, asked the way OpenClaw asks. 2 is VncAuth, 1 is None (which OpenClaw
# refuses outright), 0 is a server that is not there or has nothing to say.
#
# This runs BEFORE the restart decision, so a box that is already correct is not restarted and a
# box whose mirror never came up is. Skipped when a restart is happening anyway, because then
# the answer would be about a browser that is one task away from being killed.
- name: Ask the desktop mirror which RFB security types it offers
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: "{{ desktop_vnc_probe_script }}"
  register: desktop_vnc_first_look
  changed_when: false
  when:
    - not ci_test
    - openclaw_desktop_enabled | bool
    - not (browser_stream_script is changed or browser_stream_unit is changed)

- name: Restart browser-stream when its script, its unit, the running flags or the mirror are stale
  ansible.builtin.systemd:
    name: browser-stream
    state: restarted
    daemon_reload: true
  register: browser_stream_restarted
  when:
    - not ci_test
    - browser_stream_script is changed or browser_stream_unit is changed or
      '--enable-unsafe-swiftshader' not in (browser_cmdline_now.stdout | default('')) or
      (openclaw_desktop_enabled | bool and
       'VNCSEC=2 ' not in (desktop_vnc_first_look.stdout | default('VNCSEC=2 ')))

# Provisioning-time proof, not a one-off check by whoever last touched this. browser-stream.sh
# already refuses to start an unsandboxed browser; these two catch the ways the unit itself can
# drift — someone re-adding --no-sandbox, the memory cap being dropped from the template, or the
# flags that keep this browser indistinguishable from a person's going missing — and they run on
# every box, on every re-provision.
- name: Read the running browser's command line and limits
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      printf 'CMDLINE=%s\n' "$(pgrep -a -f '^/usr/bin/google-chrome-stable --remote-debugging' | head -1)"
      printf 'MEMMAX=%s\n' "$(systemctl show browser-stream -p MemoryMax --value)"
      printf 'SANDBOXHELPER=%s\n' "$(pgrep -c -f '/opt/google/chrome/chrome-sandbox' || true)"
    executable: /bin/bash
  register: browser_runtime
  changed_when: false
  retries: 12
  delay: 5
  # Wait for the browser this role just (re)started, not merely for "a" browser: the restart
  # above returns as soon as the unit's script is up, and Chrome appears a couple of seconds
  # later. Without the flag in the condition the first reading lands in that gap and the
  # assertion below fails against a box that was about to be fine.
  until: >-
    browser_runtime.stdout is search('CMDLINE=.+') and
    '--enable-unsafe-swiftshader' in browser_runtime.stdout
  when: not ci_test

- name: Fail when the browser is running unsandboxed, uncapped or self-identifying
  ansible.builtin.assert:
    that:
      - "'--no-sandbox' not in browser_runtime.stdout"
      - "'--disable-setuid-sandbox' not in browser_runtime.stdout"
      - browser_runtime.stdout is not search('MEMMAX=infinity')
      - "'--headless' not in browser_runtime.stdout"
      - "'--enable-automation' not in browser_runtime.stdout"
      - "'--enable-unsafe-swiftshader' in browser_runtime.stdout"
    fail_msg: >-
      browser-stream is not in the shape this role guarantees. Either Chrome is running with a
      sandbox flag turned off — it parses LLM-chosen content as the user that owns the gateway
      token — or MemoryMax is unset and a heavy page can take OpenClaw down with it, or the
      window is one a site can tell is automated.
      Observed: {{ browser_runtime.stdout | default('(no reading)') }}
  when: not ci_test

# Second look, only when something was restarted above: the first look either did not run or
# ran against the browser that has just been replaced.
- name: Ask the desktop mirror again after the restart
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: "{{ desktop_vnc_probe_script }}"
  register: desktop_vnc_second_look
  changed_when: false
  when:
    - not ci_test
    - openclaw_desktop_enabled | bool
    - browser_stream_restarted is changed

- name: Record whether this box has a desktop to advertise
  ansible.builtin.set_fact:
    browser_desktop_ready: >-
      {{ 'VNCSEC=2 ' in ((desktop_vnc_second_look.stdout | default(''))
                         if desktop_vnc_second_look is not skipped
                         else (desktop_vnc_first_look.stdout | default(''))) }}
  when:
    - not ci_test
    - openclaw_desktop_enabled | bool

# NOT an assert. A missing desktop mirror is a missing convenience, and browser-stream.yml runs
# long before the vm-agent reports ready — failing here would mean the customer gets no box at
# all because the Systems tab has no picture in it. So the play says so loudly and carries on,
# and openclaw.yml writes desktop.host.enabled=false, which is the honest answer: the Systems
# tab says "no desktop available" instead of advertising one that fails when it is opened.
# (The sandbox and memory-cap asserts above stay hard. Those are the product.)
- name: Warn when this box will report no desktop
  ansible.builtin.debug:
    msg: >-
      127.0.0.1:{{ browser_desktop_vnc_port }} does not offer VncAuth
      (read: {{ (desktop_vnc_second_look.stdout | default('') or desktop_vnc_first_look.stdout | default('')) | default('(no reading)', true) }}).
      OpenClaw will be configured WITHOUT a desktop, and its Systems tab will say so. The port is
      most likely taken by something else, or {{ browser_desktop_rfbauth_file }} is not one
      x11vnc accepts — `journalctl -u browser-stream` has the reason.
  when:
    - not ci_test
    - openclaw_desktop_enabled | bool
    - not browser_desktop_ready | bool
