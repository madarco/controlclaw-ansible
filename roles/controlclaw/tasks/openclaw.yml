---
# Install the OpenClaw gateway and run it under systemd.
#
# The unit is named `openclaw` on purpose: packages/vm-agent/src/routes/openclaw.ts hardcodes
# `const SERVICE = "openclaw"` and the console's start/stop buttons shell out to
# `sudo systemctl <action> openclaw`. The matching sudoers lines live in user.yml. Those three
# places must agree or the buttons return HTTP 500.
#
# The gateway binds loopback and is deliberately NOT opened in UFW. Caddy (caddy.yml) terminates
# TLS on 443 in front of it, behind the proxy box. `ssh -N -L 18789:127.0.0.1:18789 root@<box>`
# still works while SSH is open (ssh_debug).

- name: Assert node satisfies OpenClaw's engines range
  ansible.builtin.command: node --version
  register: openclaw_node_version
  changed_when: false

# npm picks the newest `openclaw` your node can run, so node 22 silently yields an old
# OpenClaw instead of failing. Fail loudly here rather than shipping a surprise version.
- name: Fail early when node is too old for OpenClaw
  ansible.builtin.assert:
    that:
      - openclaw_node_version.stdout | regex_replace('^v', '') is version('24.16.0', '>=')
    fail_msg: >-
      node {{ openclaw_node_version.stdout }} is too old for OpenClaw (needs >=24.16.0).
      Bump nodejs_version in roles/controlclaw/defaults/main.yml.

- name: Create OpenClaw config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ controlclaw_home }}/.openclaw", mode: '0755' }
    - { path: "{{ controlclaw_home }}/.openclaw/credentials", mode: '0700' }

# `npm install -g openclaw@latest` costs ~48s even when the package is already current, because it
# re-resolves and re-verifies 300+ packages. That made it the most expensive task on a box booted
# from the base image, which is precisely the one thing the image was supposed to make free.
# Compare versions first: one registry query (~1s) against the installed binary.
- name: Check the installed OpenClaw version
  ansible.builtin.command:
    cmd: openclaw --version
  register: openclaw_installed_version
  changed_when: false
  failed_when: false

- name: Check the latest published OpenClaw version
  ansible.builtin.command:
    cmd: npm view openclaw version
  register: openclaw_latest_version
  changed_when: false
  failed_when: false

# Install when the versions differ, when either lookup failed (no binary yet, or the registry is
# unreachable and we would rather try than silently skip), or when the box has no openclaw at all.
- name: Install OpenClaw globally from npm
  ansible.builtin.command:
    cmd: npm install -g openclaw@latest
  register: openclaw_npm_install
  when: >-
    openclaw_installed_version.rc != 0 or
    openclaw_latest_version.rc != 0 or
    openclaw_latest_version.stdout | trim not in (openclaw_installed_version.stdout | default(''))
  changed_when: openclaw_npm_install.changed

# The plan and the agent-https doc both assume /usr/bin/openclaw. NodeSource sets npm's prefix
# to /usr so that holds, but assert it rather than baking an unverified path into ExecStart.
- name: Locate the openclaw binary
  ansible.builtin.stat:
    path: /usr/bin/openclaw
  register: openclaw_bin

- name: Fail when the openclaw binary is not where the unit expects it
  ansible.builtin.assert:
    that:
      - openclaw_bin.stat.exists
    fail_msg: "openclaw was installed but is not at /usr/bin/openclaw - check npm's global prefix."

- name: Check for an existing gateway token
  ansible.builtin.stat:
    path: /opt/controlclaw/keys/openclaw_gateway_token
  register: openclaw_token_file

# Generated once and never rotated: ansible-pull re-runs on every boot, and rotating the token
# would silently break whatever link the customer saved.
- name: Generate the gateway token on first provision
  ansible.builtin.shell:
    cmd: openssl rand -hex 32 > /opt/controlclaw/keys/openclaw_gateway_token
  when: not openclaw_token_file.stat.exists
  no_log: true

- name: Secure the gateway token file
  ansible.builtin.file:
    path: /opt/controlclaw/keys/openclaw_gateway_token
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0600'

- name: Read the gateway token
  ansible.builtin.slurp:
    src: /opt/controlclaw/keys/openclaw_gateway_token
  register: openclaw_token_b64
  no_log: true

# Read the config file directly rather than shelling out to `openclaw config get`: each CLI call
# pays Node's startup cost (~4s), and four of them made this the 5th most expensive task in the
# whole provision. The file also carries the real token, whereas `config get` redacts it - so this
# is both faster and a more accurate check.
- name: Read the current OpenClaw config
  ansible.builtin.slurp:
    src: "{{ controlclaw_home }}/.openclaw/openclaw.json"
  register: openclaw_config_raw
  failed_when: false
  no_log: true

# Compare only the fields we own, not the whole gateway block: OpenClaw writes to this file
# itself (it added a top-level `plugins` key on its own), and the agent-https plan will add
# `gateway.publicOrigin`. A strict equality check would then re-patch and restart the gateway on
# every boot.
- name: Decide whether the gateway config needs writing
  ansible.builtin.set_fact:
    openclaw_config_ok: >-
      {{ openclaw_config_raw.content is defined and
         openclaw_gateway_current.mode | default('') == 'local' and
         openclaw_gateway_current.bind | default('') == 'loopback' and
         openclaw_gateway_current.port | default(0) == openclaw_gateway_port | int and
         openclaw_gateway_current.auth.mode | default('') == 'token' and
         openclaw_gateway_current.auth.token | default('') == (openclaw_token_b64.content | b64decode | trim) and
         (vm_hostname is not defined or (
           openclaw_gateway_current.publicOrigin | default('') == 'https://' ~ vm_hostname and
           openclaw_gateway_current.trustedProxies | default([]) == ['127.0.0.1'] and
           openclaw_gateway_current.controlUi.allowedOrigins | default([]) == ['https://' ~ vm_hostname])) }}
  vars:
    openclaw_gateway_current: >-
      {{ (openclaw_config_raw.content | default('') | b64decode | from_json).gateway
         if openclaw_config_raw.content is defined else {} }}
  no_log: true

# `config patch` is a single validated write against OpenClaw's own schema - better than
# templating openclaw.json ourselves, which would rot the moment the schema changes.
# gateway.mode=local is required, otherwise `gateway run` refuses to start without
# --allow-unconfigured. The JSON is built as text so `port` stays a number: piping a dict
# through `to_json` would emit "18789" as a string and fail schema validation.
# With a hostname, OpenClaw also learns its public origin (Caddy in front on 443), trusts the
# loopback proxy for forwarded headers, and allows the browser origin for its WebSocket.
- name: Configure the gateway (loopback, token auth, public origin)
  ansible.builtin.shell:
    cmd: >-
      printf '%s'
      '{"gateway":{"mode":"local","bind":"loopback","port":{{ openclaw_gateway_port | int }},"auth":{"mode":"token","token":"{{ openclaw_token_b64.content | b64decode | trim }}"}{{ openclaw_origin_json }}}}'
      | /usr/bin/openclaw config patch --stdin
  vars:
    openclaw_origin_json: >-
      {{ ',"publicOrigin":"https://' ~ vm_hostname ~ '","trustedProxies":["127.0.0.1"],"controlUi":{"allowedOrigins":["https://' ~ vm_hostname ~ '"]}'
         if vm_hostname is defined else '' }}
  become: true
  become_user: "{{ controlclaw_user }}"
  environment:
    HOME: "{{ controlclaw_home }}"
  when: not openclaw_config_ok | bool
  no_log: true
  notify: restart openclaw

# Node does not read the OS trust store, so on a secured box every outbound TLS call from
# OpenClaw would fail against the mitm proxy. NODE_EXTRA_CA_CERTS is not set here: the CA only
# exists after the vm-agent verifies and installs it at runtime, and `cc-install-ca`
# (openclaw-egress.yml) then writes a systemd drop-in with the variable and restarts OpenClaw.
# PrivateTmp is left off deliberately: OpenClaw writes its logs to /tmp/openclaw/, and a
# private namespace would hide them from an operator on the box (and from `openclaw
# diagnostics`). Revisit if the log path becomes configurable.
- name: Create the openclaw systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/openclaw.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=OpenClaw AI Gateway
      After=network-online.target docker.service
      Wants=network-online.target

      [Service]
      Type=simple
      User={{ controlclaw_user }}
      Group={{ controlclaw_user }}
      WorkingDirectory={{ controlclaw_home }}
      Environment=HOME={{ controlclaw_home }}
      ExecStart=/usr/bin/openclaw gateway run
      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=openclaw
      NoNewPrivileges=true
      PrivateTmp=false

      [Install]
      WantedBy=multi-user.target
  notify: restart openclaw

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start the openclaw service
  ansible.builtin.systemd:
    name: openclaw
    state: started
    enabled: true
  when: not ci_test
