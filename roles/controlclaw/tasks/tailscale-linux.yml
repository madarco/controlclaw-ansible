---
# Tailscale on an agent box (Debian/Ubuntu).
#
# Owner access over the owner's own tailnet (controlclaw PR #85, apps/saas/docs/features/tailscale.md)
# needs three things on EVERY agent box, whatever `tailscale_enabled` says: the package, the
# cc-tailscale root helper, and the sudoers line that lets the vm-agent run that helper. The box
# joins later, when the owner asks from the console, and the helper starts tailscaled then.
#
# `tailscale_enabled` only decides whether tailscaled runs from provisioning (the old path, with a
# key handed over at build time). With it off, the daemon is installed but stopped and disabled: an
# unjoined tailscaled has nothing to do, and a stopped one sends nothing anywhere.
#
# Until 2026-09-27 main.yml included this whole file only when `tailscale_enabled` was true, which
# the console never sets, so no box had the helper and every join failed with
# "sudo: a password is required".
#
# Egress: nothing here widens it. On a first provision the box is not confined yet (the vm-agent
# confines it as the last step), so the downloads below go out directly. On an in-place update they
# go through the org proxy like every other download the role makes, which allows pkgs.tailscale.com
# for the length of the update (agent_update_hosts in defaults/main.yml). tailscaled itself reaches
# `*.tailscale.com` only once the org firewall has recorded a join for this box (mitm-proxy/addon.py,
# TAILSCALE_HOSTS).

- name: Tailscale | Add the package signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  register: tailscale_keyring

- name: Tailscale | Add the package repository
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: "0644"
  register: tailscale_repo

- name: Tailscale | Install the package
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: "{{ tailscale_keyring is changed or tailscale_repo is changed }}"
  register: tailscale_pkg

# The Debian package enables and starts tailscaled on install. Undo that only on the run that
# installed it, so a box whose owner has already joined keeps its running daemon on every update.
- name: Tailscale | Leave a freshly installed tailscaled stopped until the owner joins
  ansible.builtin.systemd:
    name: tailscaled
    enabled: false
    state: stopped
  when:
    - tailscale_pkg is changed
    - not tailscale_enabled | bool
    - not ci_test

- name: Tailscale | Run tailscaled from provisioning (tailscale_enabled)
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  when:
    - tailscale_enabled | bool
    - not ci_test

# The helper is the only privileged Tailscale surface on the box: a fixed verb set, the auth key on
# stdin, never an argument. It starts tailscaled on `up` and stops it again on `logout`.
- name: Tailscale | Install the cc-tailscale root helper
  ansible.builtin.copy:
    src: cc-tailscale
    dest: /usr/local/bin/cc-tailscale
    owner: root
    group: root
    mode: "0755"

- name: Tailscale | Allow the controlclaw user to run exactly that helper
  ansible.builtin.copy:
    dest: /etc/sudoers.d/controlclaw-tailscale
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      {{ controlclaw_user }} ALL=(root) NOPASSWD: /usr/local/bin/cc-tailscale
