---
# Record which release this box installed, so the console can show it
# (apps/saas/docs/features/agent-settings.md). `playbook_dir` is the ansible-pull checkout, so
# this is the commit that is being applied right now: on first provisioning and on every
# cc-reprovision run alike, since both are an ansible-pull of this repo. Included last from
# main.yml, so a run that failed half way does not claim a successful install.
#
# 0644 and root-owned on purpose: the daemons read it and must not be able to write it, which is
# what makes the reported release mean something. Nothing about a version is worth failing a
# provision over: the daemons treat a missing or malformed file as "not reported".
- name: Record the installed release
  block:
    - name: Read the commit this checkout is on
      ansible.builtin.command:
        cmd: git -C {{ playbook_dir }} log -1 --format=%H%n%cI
      register: cc_release
      changed_when: false

    # The version is the newest entry of this checkout's releases.json (scripts/release.sh), so a
    # box reports the release it actually ran. An unreadable file just leaves the field out.
    - name: Read the version this checkout is on
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, os, re, subprocess, sys
            try:
                root = subprocess.check_output(["git", "-C", sys.argv[1], "rev-parse", "--show-toplevel"], text=True).strip()
                v = json.load(open(os.path.join(root, "releases.json")))[0]["version"]
            except Exception:
                v = ""
            print(v if isinstance(v, str) and re.fullmatch(r"\d+\.\d+\.\d+", v) else "")
          - "{{ playbook_dir }}"
      register: cc_version
      changed_when: false
      failed_when: false

    - name: Make sure /etc/controlclaw exists
      ansible.builtin.file:
        path: /etc/controlclaw
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write /etc/controlclaw/release.json
      ansible.builtin.copy:
        dest: /etc/controlclaw/release.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "commit": "{{ cc_release.stdout_lines[0] }}",
            {{ ('"version": "' ~ cc_version.stdout ~ '",') if cc_version.stdout | default('') else '' }}
            "commitDate": "{{ cc_release.stdout_lines[1] }}",
            "installedAt": "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          }
  rescue:
    - name: A box that cannot name its release still provisions
      ansible.builtin.debug:
        msg: "could not record the release; the console will show 'Not reported'"
