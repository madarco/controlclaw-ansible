---
# Install capabilities at provisioning. Only a firewall-signed vm-agent apply enables Meet.
- name: Meetings | install the user audio session
  ansible.builtin.apt:
    name: [pipewire-audio, pulseaudio-utils, dbus-user-session]
    state: present

- name: Meetings | create the shared virtual audio configuration directory
  ansible.builtin.file:
    path: /etc/pipewire/pipewire-pulse.conf.d
    state: directory
    mode: '0755'

- name: Meetings | provide the native plugin's virtual sink and microphone
  ansible.builtin.copy:
    dest: /etc/pipewire/pipewire-pulse.conf.d/20-controlclaw-meetings.conf
    mode: '0644'
    content: |
      pulse.cmd = [
        { cmd = "load-module" args = "module-null-sink sink_name=cc_meeting_remote rate=48000 channels=2" }
        { cmd = "load-module" args = "module-null-sink sink_name=openclaw_meeting_audio rate=48000 channels=2" }
        { cmd = "load-module" args = "module-remap-source source_name=openclaw_meeting_audio master=openclaw_meeting_audio.monitor channels=2 remix=no" }
      ]
  register: meeting_audio_config

- name: Meetings | read the controlclaw uid
  ansible.builtin.command: "id -u {{ controlclaw_user }}"
  register: meeting_user_uid
  changed_when: false

- name: Meetings | keep the user session available to system services
  ansible.builtin.command: "loginctl enable-linger {{ controlclaw_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ controlclaw_user }}"

- name: Meetings | start the user session
  ansible.builtin.systemd:
    name: "user@{{ meeting_user_uid.stdout }}.service"
    state: started

- name: Meetings | enable PipeWire, Pulse and WirePlumber
  become: true
  become_user: "{{ controlclaw_user }}"
  ansible.builtin.systemd:
    scope: user
    name: "{{ item }}"
    state: started
    enabled: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ meeting_user_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ meeting_user_uid.stdout }}/bus"
  loop: [pipewire.socket, pipewire-pulse.socket, wireplumber.service]

- name: Meetings | load changed virtual audio devices
  become: true
  become_user: "{{ controlclaw_user }}"
  ansible.builtin.systemd:
    scope: user
    name: pipewire-pulse.service
    state: restarted
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ meeting_user_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ meeting_user_uid.stdout }}/bus"
  when: meeting_audio_config.changed

- name: Meetings | connect system units to the same audio session
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    mode: '0755'
  loop: [openclaw, controlclaw-agent, browser-stream]

- name: Meetings | set the shared runtime and Pulse socket
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.service.d/meetings-session.conf"
    mode: '0644'
    content: |
      [Unit]
      Wants=user@{{ meeting_user_uid.stdout }}.service
      After=user@{{ meeting_user_uid.stdout }}.service
      [Service]
      Environment=XDG_RUNTIME_DIR=/run/user/{{ meeting_user_uid.stdout }}
      Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ meeting_user_uid.stdout }}/bus
      Environment=PULSE_SERVER=unix:/run/user/{{ meeting_user_uid.stdout }}/pulse/native
  loop: [openclaw, controlclaw-agent, browser-stream]
  notify: restart openclaw

- name: Meetings | deny microphone and camera capture in the Transcript profile
  ansible.builtin.copy:
    dest: /opt/controlclaw/meeting-browser-preferences.json
    mode: '0644'
    content: '{"profile":{"default_content_setting_values":{"media_stream_mic":2,"media_stream_camera":2}}}'

- name: Meetings | install the per-call microphone preference helper
  ansible.builtin.copy:
    src: meeting-browser-preferences.py
    dest: /opt/controlclaw/meeting-browser-preferences.py
    mode: '0644'

- name: Meetings | install the scoped speech provider
  ansible.builtin.copy:
    src: meeting-voice/
    dest: /opt/controlclaw/meeting-voice/
    owner: root
    group: root
    mode: '0755'
  notify: restart openclaw

# cc-wake (meeting-voice/cc-wake.py) loads these. Not fatal: without them a wake-mode meeting falls
# back to one transcript-gated session, and the agent does not report local listening.
- name: Meetings | install local wake-name listening
  block:
    - name: Meetings | create the wake listener directory
      ansible.builtin.file:
        path: /opt/controlclaw/cc-wake
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Meetings | download the pinned Vosk wheel
      ansible.builtin.get_url:
        url: "{{ cc_wake_vosk_wheels[cc_wake_arch].url }}"
        dest: "/opt/controlclaw/cc-wake/vosk-{{ cc_wake_wheel_id }}.whl"
        checksum: "sha256:{{ cc_wake_vosk_wheels[cc_wake_arch].sha256 }}"
        mode: '0644'

    # Unpacked per wheel, so a new pin replaces the library rather than keeping the old one.
    - name: Meetings | unpack the Vosk library from the wheel
      ansible.builtin.command:
        argv: [unzip, -o, -j, "/opt/controlclaw/cc-wake/vosk-{{ cc_wake_wheel_id }}.whl", vosk/libvosk.so, -d, "/opt/controlclaw/cc-wake/vosk-{{ cc_wake_wheel_id }}"]
        creates: "/opt/controlclaw/cc-wake/vosk-{{ cc_wake_wheel_id }}/libvosk.so"

    - name: Meetings | point cc-wake at the library
      ansible.builtin.file:
        src: "/opt/controlclaw/cc-wake/vosk-{{ cc_wake_wheel_id }}/libvosk.so"
        dest: /opt/controlclaw/cc-wake/libvosk.so
        state: link
        force: true

    - name: Meetings | download the wake model
      ansible.builtin.get_url:
        url: "https://alphacephei.com/vosk/models/{{ cc_wake_model }}.zip"
        dest: "/opt/controlclaw/cc-wake/{{ cc_wake_model }}.zip"
        checksum: "sha256:{{ cc_wake_model_sha256 }}"
        mode: '0644'

    - name: Meetings | unpack the wake model
      ansible.builtin.command:
        argv: [unzip, -o, -q, "/opt/controlclaw/cc-wake/{{ cc_wake_model }}.zip", -d, /opt/controlclaw/cc-wake]
        creates: "/opt/controlclaw/cc-wake/{{ cc_wake_model }}/conf/model.conf"

    - name: Meetings | point cc-wake at the model
      ansible.builtin.file:
        src: "/opt/controlclaw/cc-wake/{{ cc_wake_model }}"
        dest: /opt/controlclaw/cc-wake/model
        state: link
        force: true

    - name: Meetings | check that the wake listener loads
      ansible.builtin.command:
        argv: [/usr/bin/python3, /opt/controlclaw/meeting-voice/cc-wake.py, --check, ControlClaw]
      register: cc_wake_check
      changed_when: false
      failed_when: "'control claw' not in cc_wake_check.stdout"
  rescue:
    - name: Meetings | continue without local wake-name listening
      ansible.builtin.file:
        path: /opt/controlclaw/cc-wake/model
        state: absent
  vars:
    cc_wake_arch: "{{ 'aarch64' if ansible_architecture in ['aarch64', 'arm64'] else 'x86_64' }}"
    cc_wake_wheel_id: "{{ cc_wake_vosk_wheels[cc_wake_arch].sha256[:12] }}"

- name: Meetings | provision an ephemeral guest browser unit
  ansible.builtin.copy:
    dest: /etc/systemd/user/cc-meeting-browser.service
    mode: '0644'
    content: |
      [Unit]
      Description=ControlClaw reserved Google Meet guest browser
      After=pipewire-pulse.socket
      [Service]
      Type=simple
      Environment=DISPLAY=:1
      Environment=PULSE_SERVER=unix:%t/pulse/native
      Environment=PULSE_SINK=cc_meeting_remote
      Environment=PULSE_SOURCE=openclaw_meeting_audio
      RuntimeDirectory=cc-meetings
      RuntimeDirectoryMode=0700
      ExecStartPre=/usr/bin/mkdir -p %t/cc-meetings/profile/Default
      ExecStartPre=/usr/bin/python3 /opt/controlclaw/meeting-browser-preferences.py %t/cc-meetings/profile/Default/Preferences
      ExecStart=/usr/bin/google-chrome-stable --user-data-dir=%t/cc-meetings/profile --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 --no-first-run --no-default-browser-check --disable-sync --disable-background-networking --password-store=basic --force-webrtc-ip-handling-policy=disable_non_proxied_udp --autoplay-policy=no-user-gesture-required about:blank
      KillMode=control-group
      TimeoutStopSec=10
      MemoryMax=2G
      OOMScoreAdjust=500
      # No Install section: vm-agent owns its lifetime. RuntimeDirectory removes every cookie.

- name: Meetings | reload the user units
  become: true
  become_user: "{{ controlclaw_user }}"
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ meeting_user_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ meeting_user_uid.stdout }}/bus"

- name: Meetings | install the pinned provenance check
  ansible.builtin.copy:
    src: meeting-install-check.mjs
    dest: /opt/controlclaw/meeting-install-check.mjs
    mode: '0644'

- name: Meetings | check the official package provenance and integrity
  ansible.builtin.command:
    argv: [/usr/bin/node, /opt/controlclaw/meeting-install-check.mjs, "{{ openclaw_meet_version }}", "{{ openclaw_meet_sha512 }}"]
    chdir: "{{ controlclaw_home }}"
  become: true
  become_user: "{{ controlclaw_user }}"
  environment: "{{ controlclaw_node_env | combine({'HOME': controlclaw_home}) }}"
  register: meeting_installed
  changed_when: false

- name: Meetings | determine whether the pinned official install is needed
  ansible.builtin.set_fact:
    meeting_install_needed: "{{ not (meeting_installed.stdout | from_json).ok }}"

- name: Meetings | download the verified Meet package
  ansible.builtin.get_url:
    url: "https://registry.npmjs.org/@openclaw/google-meet/-/google-meet-{{ openclaw_meet_version }}.tgz"
    dest: /opt/controlclaw/google-meet.tgz
    checksum: "sha512:{{ openclaw_meet_sha512 }}"
    mode: '0644'
  when: meeting_install_needed | bool

- name: Meetings | stop the gateway before installing a disabled plugin
  ansible.builtin.systemd:
    name: openclaw
    state: stopped
  failed_when: false

- name: Meetings | install the pinned official package
  ansible.builtin.command:
    argv: [/usr/bin/openclaw, plugins, install, "@openclaw/google-meet@{{ openclaw_meet_version }}", --force, --pin, --no-enable, --accept-capabilities]
    chdir: "{{ controlclaw_home }}"
  become: true
  become_user: "{{ controlclaw_user }}"
  environment: "{{ controlclaw_node_env | combine({'HOME': controlclaw_home}) }}"
  when: meeting_install_needed | bool
  notify: restart openclaw

- name: Meetings | verify the installed official package before activation
  ansible.builtin.command:
    argv: [/usr/bin/node, /opt/controlclaw/meeting-install-check.mjs, "{{ openclaw_meet_version }}", "{{ openclaw_meet_sha512 }}"]
    chdir: "{{ controlclaw_home }}"
  become: true
  become_user: "{{ controlclaw_user }}"
  environment: "{{ controlclaw_node_env | combine({'HOME': controlclaw_home}) }}"
  register: meeting_verified
  changed_when: false
  failed_when: not (meeting_verified.stdout | from_json).ok

- name: Meetings | install the browser reservation hook
  ansible.builtin.copy:
    src: meeting-guard/
    dest: /opt/controlclaw/meeting-guard/
    owner: root
    group: root
    mode: '0755'
  notify: restart openclaw

- name: Meetings | install the reviewed compatibility patch helper
  ansible.builtin.copy:
    src: meeting-runtime-patch.py
    dest: /opt/controlclaw/meeting-runtime-patch.py
    owner: root
    group: root
    mode: '0755'

- name: Meetings | bind native capture to the reserved guest browser and private notes
  ansible.builtin.command:
    argv: [/usr/bin/python3, /opt/controlclaw/meeting-runtime-patch.py, /usr/lib/node_modules/openclaw, "{{ (meeting_verified.stdout | from_json).installPath }}"]
  register: meeting_patched
  changed_when: "'changed' in meeting_patched.stdout"
  notify: restart openclaw

- name: Meetings | initialize disabled config and reserve the guest profile
  ansible.builtin.command:
    argv: [/usr/bin/python3, /opt/controlclaw/meeting-config.py, "{{ controlclaw_home }}/.openclaw/openclaw.json"]
  become: true
  become_user: "{{ controlclaw_user }}"
  register: meeting_configured
  changed_when: "'changed' in meeting_configured.stdout"
  notify: restart openclaw
