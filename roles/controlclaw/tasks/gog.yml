---
# The organisation's own Google account on an agent box (controlclaw docs/plans/google-account.md).
#
# Everything here is inert. A pinned `gog`, a wrapper in front of it, and an empty state directory.
# Nothing authenticates until the org firewall pushes a placeholder to the vm-agent
# (`POST /google/apply`, verified against the firewall's pinned key with purpose `google`), which
# writes `{{ gog_env_file }}`.
#
# **No Google credential ever lands here**: no refresh token, no client secret, no key file, nothing
# in GOG_HOME. `GOG_ACCESS_TOKEN` is a placeholder the firewall generated, and the org proxy swaps it
# for a real access token on *.googleapis.com for this box's traffic only. A compromised box holds a
# string that is worth nothing off this box and off that domain.
#
# Two things the egress wiring gives us for free (openclaw-egress.yml): `gog` is a static Go binary
# that reads the system trust store, so the org CA already covers its TLS — no NODE_EXTRA_CA_CERTS
# equivalent to set — and `http.ProxyFromEnvironment` plus the nftables REDIRECT already route it
# through the proxy. There is nothing Google-specific on the egress path.

- name: Google account | Look for a gog already at the pinned version
  ansible.builtin.command: "{{ gog_real_bin }} --version"
  register: gog_have
  changed_when: false
  failed_when: false

- name: Google account | Create the directory the real binary lives in
  ansible.builtin.file:
    path: "{{ gog_real_bin | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Google account | Download the pinned gog
  ansible.builtin.get_url:
    url: "https://github.com/openclaw/gogcli/releases/download/v{{ gog_version }}/gogcli_{{ gog_version }}_linux_{{ gog_arch }}.tar.gz"
    dest: "/tmp/gogcli_{{ gog_version }}_linux_{{ gog_arch }}.tar.gz"
    # Version in the URL, checksum on the file: neither a moved release nor a replaced artifact gets
    # installed silently.
    checksum: "sha256:{{ gog_sha256_amd64 if gog_arch == 'amd64' else gog_sha256_arm64 }}"
    mode: '0644'
  vars:
    gog_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  when: "gog_version not in (gog_have.stdout | default(''))"

- name: Google account | Unpack gog
  ansible.builtin.unarchive:
    src: "/tmp/gogcli_{{ gog_version }}_linux_{{ gog_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/gog-{{ gog_version }}/gog"
    extra_opts:
      - "--one-top-level=gog-{{ gog_version }}"
  vars:
    gog_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  when: "gog_version not in (gog_have.stdout | default(''))"

- name: Google account | Install gog
  ansible.builtin.copy:
    src: "/tmp/gog-{{ gog_version }}/gog"
    dest: "{{ gog_real_bin }}"
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  when: "gog_version not in (gog_have.stdout | default(''))"

# On PATH, in front of the real binary. It sources the environment file on every invocation, so a
# grant or a revoke takes effect on the next command with nothing restarted — see the file's header
# for why that is not a systemd EnvironmentFile.
- name: Google account | Install the gog wrapper on PATH
  ansible.builtin.copy:
    src: cc-gog
    dest: /usr/local/bin/gog
    owner: root
    group: root
    mode: '0755'

# 0750 root:controlclaw. The agent reads and traverses; it does not write. Nothing secret is in here
# — with a direct token gog stores no credential at all — but a config the agent can rewrite is a
# config a compromised box could point somewhere else.
- name: Google account | Create GOG_HOME outside the agent's own home
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ controlclaw_user }}"
    mode: '0750'
  loop:
    - "{{ gog_home }}"
    - "{{ gog_home }}/cache"

- name: Google account | Check gog runs and reports its version
  ansible.builtin.command: /usr/local/bin/gog --version
  register: gog_installed
  changed_when: false
  failed_when: gog_version not in gog_installed.stdout


# ---------------------------------------------------------------------------
# Gmail push (controlclaw docs/plans/webhooks.md §7).
#
# `gog gmail watch serve` is the listener a Google Pub/Sub push ends up at. It binds loopback
# inside the 8700-8799 range the vm-agent allows a delivery to reach, and the org firewall is what
# puts a delivery in front of it: the public URL is the firewall's, the OIDC token is checked
# there, and only then is the request replayed here.
#
# The unit is STATIC and inert until the vm-agent writes its environment file, which happens when
# somebody confirms a Gmail webhook in the console. A box with no Gmail webhook has this unit
# installed, stopped, and holding no configuration at all.
# ---------------------------------------------------------------------------

- name: Gmail push | The watcher unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/cc-gmail-watch.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=ControlClaw Gmail push watcher (gog gmail watch serve)
      After=network-online.target
      Wants=network-online.target
      # Inert without the environment file the vm-agent writes on a confirmed Gmail webhook.
      ConditionPathExists=/etc/controlclaw/gmail-watch.env

      [Service]
      Type=simple
      User={{ controlclaw_user }}
      EnvironmentFile=/etc/controlclaw/gmail-watch.env
      # --oidc-audience is set EXPLICITLY. Left unset, gog rebuilds it from X-Forwarded-Proto and
      # X-Forwarded-Host, which is one proxy hop away from accepting a token minted for somebody
      # else. The firewall has already checked the same token; this is defence in depth and the
      # two checks are independent.
      ExecStart=/usr/local/bin/gog gmail watch serve \
        --addr 127.0.0.1:${CC_GMAIL_PORT} \
        --path ${CC_GMAIL_PATH} \
        --verify-oidc \
        --oidc-audience ${CC_GMAIL_AUDIENCE}
      Restart=always
      RestartSec=10
      # The listener parses whatever Google (or anyone past the firewall) sends it, so it gets the
      # ordinary confinement the rest of the box's units have.
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths={{ gog_home }}

      [Install]
      WantedBy=multi-user.target

- name: Gmail push | Renew the watch twice a day
  ansible.builtin.copy:
    dest: /etc/systemd/system/cc-gmail-watch-renew.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=ControlClaw Gmail watch renewal
      ConditionPathExists=/etc/controlclaw/gmail-watch.env

      [Service]
      Type=oneshot
      User={{ controlclaw_user }}
      EnvironmentFile=/etc/controlclaw/gmail-watch.env
      # Google expires a watch after seven days, so this runs twice a day. It is an ordinary Gmail
      # API call and goes out through the proxy with the placeholder like everything else `gog`
      # does, so the real token never touches this box.
      ExecStart=/usr/local/bin/gog gmail watch start --account ${CC_GMAIL_ACCOUNT} --label INBOX --topic ${CC_GMAIL_TOPIC}

- name: Gmail push | The renewal timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/cc-gmail-watch-renew.timer
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Renew the ControlClaw Gmail watch every 12 hours

      [Timer]
      OnBootSec=15min
      OnUnitActiveSec=12h
      AccuracySec=5min

      [Install]
      WantedBy=timers.target

# The vm-agent restarts the watcher when a Gmail webhook is confirmed or revoked. Two lines, both
# naming the unit exactly, so taking the vm-agent buys the ability to bounce this one service and
# nothing else.
- name: Gmail push | Let the agent start and stop the watcher
  ansible.builtin.copy:
    dest: /etc/sudoers.d/controlclaw-gmail-watch
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
    content: |
      {{ controlclaw_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl restart cc-gmail-watch.service
      {{ controlclaw_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl stop cc-gmail-watch.service

- name: Gmail push | Enable the units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - cc-gmail-watch.service
    - cc-gmail-watch-renew.timer
  when: not ci_test
