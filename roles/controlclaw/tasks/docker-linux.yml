---
# Linux-specific Docker installation (apt-based)
#
# The six install tasks are skipped on a first boot from an image built from this commit (the image
# carries Docker's keyring, its repository and the packages, and tasks/fast-path.yml has checked
# that `docker` is on PATH). The three tasks that follow them are STATE, not installation — the
# daemon enabled and running, the service account in the `docker` group — and run on every boot,
# so a box whose image drifted still converges.
- name: Install required system packages for Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not cc_skip.docker | default(false) | bool

- name: Create directory for Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: not cc_skip.docker | default(false) | bool

- name: Add Docker GPG key
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg | \
        gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
    creates: /etc/apt/keyrings/docker.gpg
    executable: /bin/bash
  register: docker_key
  when: not cc_skip.docker | default(false) | bool

- name: Add Docker repository
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      echo "deb [arch=$(dpkg --print-architecture) \
        signed-by=/etc/apt/keyrings/docker.gpg] \
        https://download.docker.com/linux/{{ ansible_distribution | lower }} \
        $(lsb_release -cs) stable" | \
        tee /etc/apt/sources.list.d/docker.list > /dev/null
    creates: /etc/apt/sources.list.d/docker.list
    executable: /bin/bash
  register: docker_repo
  when: not cc_skip.docker | default(false) | bool

# Unconditional only when the repository line is new; otherwise the pre_tasks refresh stands.
- name: Update apt cache after adding Docker repo
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if (docker_repo is changed or docker_key is changed) else 3600 }}"
  when: not cc_skip.docker | default(false) | bool

- name: Install Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    lock_timeout: 300
  when: not cc_skip.docker | default(false) | bool

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ controlclaw_user }}"
    groups: docker
    append: true

- name: Reset SSH connection to apply docker group
  ansible.builtin.meta: reset_connection
