---
# The 1Password CLI on the FIREWALL (controlclaw docs/plans/website-credentials.md, phase 4).
#
# Inert until an owner connects a 1Password service account on the firewall's logins page: the
# mitm-agent then runs `op` with that token in the child's environment to read the vaults it was
# given. Nothing here holds a token. The binary is pinned by version and checksum, like gog.

- name: 1Password CLI | Look for op at the pinned version
  ansible.builtin.command: "/usr/local/bin/op --version"
  register: op_have
  changed_when: false
  failed_when: false

- name: 1Password CLI | Download the pinned op
  ansible.builtin.get_url:
    url: "https://cache.agilebits.com/dist/1P/op2/pkg/v{{ op_cli_version }}/op_linux_{{ op_arch }}_v{{ op_cli_version }}.zip"
    dest: "/tmp/op_{{ op_cli_version }}_{{ op_arch }}.zip"
    checksum: "sha256:{{ op_cli_sha256_amd64 if op_arch == 'amd64' else op_cli_sha256_arm64 }}"
    mode: '0644'
  vars:
    op_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  when: "op_cli_version not in (op_have.stdout | default(''))"

- name: 1Password CLI | Unpack op
  ansible.builtin.unarchive:
    src: "/tmp/op_{{ op_cli_version }}_{{ op_arch }}.zip"
    dest: /usr/local/bin
    remote_src: true
    include: [op]
    owner: root
    group: root
    mode: '0755'
  vars:
    op_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  when: "op_cli_version not in (op_have.stdout | default(''))"
