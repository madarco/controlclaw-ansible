---
# Linux-specific firewall configuration (UFW) with security hardening

# Install and configure fail2ban for SSH brute-force protection
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Configure fail2ban for SSH protection
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
    content: |
      # ControlClaw security hardening - SSH protection
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5
      backend = systemd

      [sshd]
      enabled = true
      port = ssh
      filter = sshd
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

# Install and configure unattended-upgrades for automatic security updates
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Configure automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Configure unattended-upgrades to only install security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      // ControlClaw security hardening - automatic security updates
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Package-Blacklist {
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

# UFW Firewall configuration
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }
    - { direction: 'routed', policy: 'deny' }

# The Hetzner firewall (Terraform var agent_ssh_debug) is the real SSH gate; this mirrors it.
- name: Allow SSH on port 22 (ssh_debug)
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    comment: 'SSH'
  when: ssh_debug | bool

- name: Remove the SSH rule when ssh_debug is off
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    delete: true
  when: not ssh_debug | bool

# Agent boxes: 80 (ACME) and 443 (dashboard + control plane) only from the proxy box. Without a
# proxy_ip (base-image build, CI) fall back to any source; the Hetzner firewall still applies.
- name: Allow HTTP/HTTPS from the proxy box only (agent)
  community.general.ufw:
    rule: allow
    from_ip: "{{ proxy_ip }}"
    port: "{{ item }}"
    proto: tcp
    comment: 'via proxy'
  loop: ['80', '443']
  when: box_role == 'openclaw' and proxy_ip | length > 0

# The base image is built without a proxy_ip and therefore carries the any-source rules;
# drop them once the real box knows its proxy.
- name: Remove any-source HTTP/HTTPS rules once the proxy is known (agent)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    delete: true
  loop: ['80', '443']
  when: box_role == 'openclaw' and proxy_ip | length > 0

- name: Allow HTTP/HTTPS from anywhere (agent without a known proxy)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: 'HTTP/HTTPS'
  loop: ['80', '443']
  when: box_role == 'openclaw' and proxy_ip | length == 0

- name: Allow HTTP/HTTPS from anywhere (proxy)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: 'proxy'
  loop: ['80', '443']
  when: box_role == 'proxy'

- name: Allow Tailscale UDP port 41641
  community.general.ufw:
    rule: allow
    port: '41641'
    proto: udp
    comment: 'Tailscale'
  when: tailscale_enabled | bool

- name: Get default network interface
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ip route | grep default | awk '{print $5}' | head -n1
    executable: /bin/bash
  register: default_interface
  changed_when: false

- name: Validate default network interface was detected
  ansible.builtin.assert:
    that:
      - default_interface.stdout is defined
      - default_interface.stdout | length > 0
    fail_msg: "Failed to detect default network interface. Cannot configure firewall rules safely."
    success_msg: "Default network interface detected: {{ default_interface.stdout }}"

- name: Create UFW after.rules for Docker isolation
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Docker isolation"
    insertbefore: "^COMMIT$"
    block: |
      # Docker port isolation - block all forwarded traffic by default
      :DOCKER-USER - [0:0]

      # Allow established connections
      -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

      # Allow localhost
      -A DOCKER-USER -i lo -j ACCEPT

      # Block all other forwarded traffic to Docker containers from external interface
      -A DOCKER-USER -i {{ default_interface.stdout }} -j DROP
    create: false
  when: box_role != 'proxy'

- name: Create Docker daemon config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'
  when: box_role != 'proxy'

- name: Configure Docker daemon to work with UFW
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart docker
  when: box_role != 'proxy'

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Reload UFW
  community.general.ufw:
    state: reloaded
