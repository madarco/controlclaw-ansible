---
# Caddy on the agent box: terminates TLS for <vm_hostname> with its own Let's Encrypt
# certificate (HTTP-01, relayed by the proxy box on port 80) and routes:
#   /__cc/login, /__cc/session, /__cc/verify  -> vm-agent (ControlClaw login shim, no bearer)
#   /__cc/agent/*  (prefix stripped)           -> vm-agent (control plane, bearer JWT)
#   everything else, after forward_auth        -> OpenClaw gateway on loopback
# The install half runs always (so the base image carries the package); the config half needs
# vm_hostname, which the control plane passes per box.

- name: Download the Caddy apt repository key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable-archive-keyring.asc
    mode: '0644'

# Same keyring path and list name as the official install instructions, so a box that was
# set up by hand converges instead of conflicting on Signed-By.
- name: Dearmor the Caddy apt repository key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg /usr/share/keyrings/caddy-stable-archive-keyring.asc
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Add Caddy apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    filename: caddy-stable
    state: present

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

# The package ships an enabled unit serving a static site on :80. Keep it down until we have a
# hostname to configure; an image build must not leave a listener behind.
- name: Stop and disable Caddy until configured
  ansible.builtin.systemd:
    name: caddy
    state: stopped
    enabled: false
  when: vm_hostname is not defined

- name: Write the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
    validate: /usr/bin/caddy validate --config %s --adapter caddyfile
  when: vm_hostname is defined
  notify: restart caddy

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
    daemon_reload: true
  when: vm_hostname is defined and not ci_test

# The live browser's gate, checked rather than assumed. Caddy asks the vm-agent
# (/__cc/verify-view) before it proxies a single frame of noVNC, and the whole design rests on
# that answering 401 to anyone without a view session. This is the cheap end of that: ask the
# vm-agent directly, on loopback, with no cookie. Deliberately NOT through Caddy on 443 — the
# certificate is still being issued at this point in a provision and a flaky security check is
# one that gets disabled.
- name: Check the live browser's gate refuses an unauthenticated request
  ansible.builtin.uri:
    url: "http://127.0.0.1:3100/__cc/verify-view"
    status_code: 401
  register: novnc_gate
  retries: 10
  delay: 3
  until: novnc_gate is succeeded
  when: vm_hostname is defined and not ci_test and browser_stream_enabled | bool

- name: Check the Caddyfile actually routes noVNC through that gate
  ansible.builtin.command:
    cmd: grep -qF '/__cc/verify-view' /etc/caddy/Caddyfile
  changed_when: false
  when: vm_hostname is defined and browser_stream_enabled | bool
