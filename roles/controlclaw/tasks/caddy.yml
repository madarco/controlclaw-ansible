---
# Caddy on the agent box: terminates TLS for <vm_hostname> with its own Let's Encrypt
# certificate (HTTP-01, relayed by the proxy box on port 80) and routes:
#   /__cc/login, /__cc/session, /__cc/verify  -> vm-agent (ControlClaw login shim, no bearer)
#   /__cc/agent/*  (prefix stripped)           -> vm-agent (control plane, bearer JWT)
#   everything else, after forward_auth        -> OpenClaw gateway on loopback
# The install half runs always (so the base image carries the package); the config half needs
# vm_hostname, which the control plane passes per box.

# The four install tasks are skipped on a first boot from an image built from this commit: the
# image build installs Caddy explicitly and tasks/fast-path.yml has checked the binary is there.
# The config half below — the Caddyfile, its `caddy validate`, enabling the unit, and the two
# grep assertions that the noVNC gate and the firewall's single path prefix are in it — runs on
# every boot, because all of it is per-box.
# Installed from the GitHub release, pinned by version and checksum, not from Caddy's cloudsmith
# apt repository: that repository signs with an expired subkey (see playbooks/install.yml, which
# removes its source), so an apt install from it fails on every box. The .deb is the same package
# the repository shipped (same unit, same caddy user), so boxes installed either way converge.
- name: Download the Caddy package
  ansible.builtin.get_url:
    url: "https://github.com/caddyserver/caddy/releases/download/v{{ caddy_version }}/caddy_{{ caddy_version }}_linux_{{ caddy_deb_arch }}.deb"
    dest: "/var/cache/caddy_{{ caddy_version }}_{{ caddy_deb_arch }}.deb"
    checksum: "sha512:{{ caddy_deb_sha512[caddy_deb_arch] }}"
    mode: '0644'
  when: not cc_skip.caddy | default(false) | bool

- name: Install Caddy
  ansible.builtin.apt:
    deb: "/var/cache/caddy_{{ caddy_version }}_{{ caddy_deb_arch }}.deb"
    lock_timeout: 300
  when: not cc_skip.caddy | default(false) | bool

# The package ships an enabled unit serving a static site on :80. Keep it down until we have a
# hostname to configure; an image build must not leave a listener behind.
- name: Stop and disable Caddy until configured
  ansible.builtin.systemd:
    name: caddy
    state: stopped
    enabled: false
  when: vm_hostname is not defined

# A firewall box runs Caddy for one reason only (inbound webhooks), so it gets its own
# template: none of the agent routes — OpenClaw, noVNC, the login shim — exist on that box, and
# templating them in would widen the one surface this feature is meant to keep narrow.
- name: Read the claimed pool handle if present
  ansible.builtin.command: cat /etc/controlclaw/handle-hostname
  register: pool_handle_file
  changed_when: false
  failed_when: false

- name: Keep only a valid same-suffix handle alias
  ansible.builtin.set_fact:
    cc_handle_alias: "{{ pool_handle_file.stdout if (pool_handle_file.rc == 0 and pool_handle_file.stdout is match('^[a-z0-9][a-z0-9-]{0,62}\\.' ~ (vm_hostname.split('.', 1)[1] | regex_escape) ~ '$')) else '' }}"
  when: vm_hostname is defined and vm_hostname | length > 0

- name: Write the Caddyfile
  ansible.builtin.template:
    src: "{{ 'Caddyfile-mitm.j2' if box_role == 'mitm' else ('Caddyfile-gbrain.j2' if box_role == 'gbrain' else 'Caddyfile.j2') }}"
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
    validate: /usr/bin/caddy validate --config %s --adapter caddyfile
  when: vm_hostname is defined
  notify: restart caddy

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
    daemon_reload: true
  when: vm_hostname is defined and not ci_test

# The live check of that gate (asking the vm-agent on loopback) lives in vm-agent-start.yml: it
# needs the agent running, and the agent is started as the last step of the play.
- name: Check the Caddyfile actually routes noVNC through that gate
  ansible.builtin.command:
    cmd: grep -qF '/__cc/verify-view' /etc/caddy/Caddyfile
  changed_when: false
  when: vm_hostname is defined and browser_stream_enabled | bool and box_role == 'openclaw'

# The firewall's Caddyfile must serve the webhook prefix and nothing else. Asserted rather than
# assumed: "one path and a 404" is the claim the whole ingress design rests on.
# GBrain is reached in one place only, its admin page, and only behind the ControlClaw session check
# that comes first in that block. Its MCP server stays off the public name.
- name: Check the brain's Caddyfile routes the vm-agent, and GBrain only behind the session check
  ansible.builtin.shell:
    cmd: >-
      grep -qF '/__cc/agent/*' /etc/caddy/Caddyfile
      && [ "$(grep -cE '127\.0\.0\.1:{{ gbrain_port }}' /etc/caddy/Caddyfile)" = 1 ]
      && grep -B8 -E '127\.0\.0\.1:{{ gbrain_port }}' /etc/caddy/Caddyfile | grep -qF 'uri /__cc/verify'
      && ! grep -qE 'handle /mcp' /etc/caddy/Caddyfile
  changed_when: false
  when: vm_hostname is defined and box_role == 'gbrain'

- name: Check the firewall's Caddyfile serves only the webhook prefix
  ansible.builtin.command:
    cmd: grep -qF '/hook/*' /etc/caddy/Caddyfile
  changed_when: false
  when: vm_hostname is defined and box_role == 'mitm'

# And the two Open routes, as exact paths (browser-enrollment.md §3).
- name: Check the firewall's Caddyfile routes the two Open paths
  ansible.builtin.command:
    cmd: grep -qF '@access path /__cc/open /__cc/enroll/confirm' /etc/caddy/Caddyfile
  changed_when: false
  when: vm_hostname is defined and box_role == 'mitm'
