---
# The Rust binaries this box's components run (controlclaw docs/ops/rust-release.md). Included by
# vm-agent.yml and mitmbox.yml before they write their units, with `rust_components`: one item per
# unit, as
#   { unit: <systemd unit>, bin: <binary>, migrate_role: agent|firewall|'',
#     migrate_env: <the store paths the unit gives the agent, optional> }
# It sets `cc_rust_dir`, the folder of the pinned release, which the unit templates run from.
#
# There is no Node build to go back to. Anything that goes wrong here (not x86_64, a download that
# fails, a binary or page asset that is not the pinned one, stores the Rust build cannot read) fails
# the run before a unit is written: the update shows as failed and the units keep running what they
# ran before. Fix the cause and run the update again; to go back, pin the previous release.

- name: Rust | the pinned release
  ansible.builtin.include_vars:
    file: rust_release.yml

- name: Rust | x86_64 only
  ansible.builtin.assert:
    that:
      - ansible_architecture == 'x86_64'
      - cc_rust_release.version | length > 0
    fail_msg: >-
      This box is {{ ansible_architecture }}, or no Rust release is pinned. The role installs the
      x86_64 builds only, and there is no Node build of these components any more.

- name: Rust | the binaries these components need
  ansible.builtin.set_fact:
    cc_rust_dir: "/opt/controlclaw/rust/{{ cc_rust_release.version }}"
    rust_bins: "{{ (rust_components | map(attribute='bin') | list + (['cc-migrate'] if rust_components | selectattr('migrate_role') | list | length > 0 else [])) | unique }}"

# The firewall agent's page assets (the stylesheet and the page scripts), read from dist-ui/ next
# to its binary: without them every firewall page is unstyled.
- name: Rust | the page assets those need
  ansible.builtin.set_fact:
    rust_ui: "{{ (cc_rust_release.ui | default({}) | list) if 'mitm-agent' in rust_bins else [] }}"

- name: Rust | every binary has a pin
  ansible.builtin.assert:
    that:
      - cc_rust_release.binaries[item] is defined
    fail_msg: "Release {{ cc_rust_release.version }} pins no {{ item }}."
  loop: "{{ rust_bins }}"

- name: Rust | the firewall agent's page assets are pinned
  ansible.builtin.assert:
    that: rust_ui | length > 0
    fail_msg: "Release {{ cc_rust_release.version }} pins no page assets for the firewall agent."
  when: "'mitm-agent' in rust_bins"

- name: Rust | this release's folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ [cc_rust_dir] + ([cc_rust_dir ~ '/dist-ui'] if rust_ui | length > 0 else []) }}"

# Root-owned: the agent's own user cannot change what it runs. get_url checks the sha256 and fails
# on a mismatch, so a binary that is not the pinned one never lands.
- name: Rust | download the pinned binaries
  ansible.builtin.get_url:
    url: "{{ cc_rust_release.base_url }}/{{ cc_rust_release.binaries[item].asset }}"
    dest: "{{ cc_rust_dir }}/{{ item }}"
    checksum: "sha256:{{ cc_rust_release.binaries[item].sha256 }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ rust_bins }}"
  register: rust_download
  retries: 3
  delay: 10
  until: rust_download is succeeded
  when: cc_rust_source == 'release'

- name: Rust | download the pinned page assets
  ansible.builtin.get_url:
    url: "{{ cc_rust_release.base_url }}/{{ cc_rust_release.ui[item].asset }}"
    dest: "{{ cc_rust_dir }}/dist-ui/{{ item }}"
    checksum: "sha256:{{ cc_rust_release.ui[item].sha256 }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ rust_ui }}"
  register: rust_ui_download
  retries: 3
  delay: 10
  until: rust_ui_download is succeeded
  when: cc_rust_source == 'release'

- name: Rust | the staged binaries (dev rounds)
  ansible.builtin.copy:
    src: "rust/{{ cc_rust_release.binaries[item].asset }}"
    dest: "{{ cc_rust_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ rust_bins }}"
  when: cc_rust_source == 'files'

- name: Rust | the staged page assets (dev rounds)
  ansible.builtin.copy:
    src: "rust/{{ cc_rust_release.ui[item].asset }}"
    dest: "{{ cc_rust_dir }}/dist-ui/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ rust_ui }}"
  when: cc_rust_source == 'files'

# Checked again whatever the source: a staged file is copied without a checksum, and a file already
# on disk is the one that runs. One that is not the pinned one is removed and fails the run.
- name: Rust | hash every binary
  ansible.builtin.stat:
    path: "{{ cc_rust_dir }}/{{ item }}"
    checksum_algorithm: sha256
  loop: "{{ rust_bins }}"
  register: rust_bin_stats

- name: Rust | hash every page asset
  ansible.builtin.stat:
    path: "{{ cc_rust_dir }}/dist-ui/{{ item }}"
    checksum_algorithm: sha256
  loop: "{{ rust_ui }}"
  register: rust_ui_stats

- name: Rust | a binary that is not the pinned one goes
  ansible.builtin.file:
    path: "{{ cc_rust_dir }}/{{ item.item }}"
    state: absent
  loop: "{{ rust_bin_stats.results }}"
  loop_control: { label: "{{ item.item }}" }
  when: item.stat.exists and item.stat.checksum != cc_rust_release.binaries[item.item].sha256

- name: Rust | a page asset that is not the pinned one goes
  ansible.builtin.file:
    path: "{{ cc_rust_dir }}/dist-ui/{{ item.item }}"
    state: absent
  loop: "{{ rust_ui_stats.results | default([]) }}"
  loop_control: { label: "{{ item.item }}" }
  when: item.stat.exists and item.stat.checksum != cc_rust_release.ui[item.item].sha256

- name: Rust | every binary is the pinned one
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.checksum == cc_rust_release.binaries[item.item].sha256
    fail_msg: "{{ item.item }} is missing or is not the binary release {{ cc_rust_release.version }} pins."
  loop: "{{ rust_bin_stats.results }}"
  loop_control: { label: "{{ item.item }}" }

- name: Rust | every page asset is the pinned one
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.checksum == cc_rust_release.ui[item.item].sha256
    fail_msg: "dist-ui/{{ item.item }} is missing or is not the file release {{ cc_rust_release.version }} pins."
  loop: "{{ rust_ui_stats.results | default([]) }}"
  loop_control: { label: "{{ item.item }}" }

# The Rust build must read every store this box has before its unit is written. check reads only,
# so it runs beside the service. A future `cc-migrate up` (a format change) must run with the unit
# stopped: stop it, up, then the unit task starts it.
#
# A failure fails the run, before the unit is touched, so the agent keeps running what it ran before
# (on a box from before this release, maybe the Node build). The report names the store; the stores
# are not changed.
- name: Rust | the Rust build can read this box's stores
  ansible.builtin.command:
    argv:
      - "{{ cc_rust_dir }}/cc-migrate"
      - check
      - --role
      - "{{ item.migrate_role }}"
  become: true
  become_user: "{{ controlclaw_user }}"
  environment: "{{ {'ORG_ID': org_id | default(''), 'BOX_ID': vm_id | default(''), 'BOX_KEY_PATH': '/opt/controlclaw/keys/box_key'} | combine(item.migrate_env | default({})) }}"
  loop: "{{ rust_components | selectattr('migrate_role') | list }}"
  loop_control: { label: "{{ item.unit }}" }
  changed_when: false

# What the Node fallback left: its markers (`.fallback`, `.node-exec`, `.release`), its helper and
# its unit. A box with a marker ran Node for the whole release; from here it runs Rust.
- name: Rust | the Node fallback's markers go
  ansible.builtin.file:
    path: /etc/controlclaw/runtime
    state: absent

- name: Rust | the Node fallback's helper and unit go
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/cc-runtime-fallback
    - /etc/systemd/system/cc-runtime-fallback@.service

# Older releases' binaries: nothing runs them after this run's units (a process still running one
# keeps its copy until it restarts).
- name: Rust | the release folders on this box
  ansible.builtin.find:
    paths: /opt/controlclaw/rust
    file_type: directory
  register: rust_folders

- name: Rust | prune the folders of releases no longer pinned
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ rust_folders.files | default([]) | rejectattr('path', 'equalto', cc_rust_dir) | list }}"
  loop_control: { label: "{{ item.path }}" }
