---
# ControlClaw VM Agent: the Rust agent every box runs (tasks/rust-runtime.yml), plus the template
# runner and the agent's pages, which stay in /opt/controlclaw/agent.

- name: Create agent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0750'
  loop:
    - /opt/controlclaw/agent
    - /opt/controlclaw/keys
    # Cursors and other small persistent state of the agent (audit ledger position).
    - /opt/controlclaw/state

- name: Write VM private key
  ansible.builtin.copy:
    dest: /opt/controlclaw/keys/vm_private_key.pem
    content: "{{ vm_private_key }}"
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0600'
  when: vm_private_key is defined
  no_log: true

- name: Write SaaS public key
  ansible.builtin.copy:
    dest: /opt/controlclaw/keys/saas_public_key.pem
    content: "{{ saas_public_key }}"
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0644'
  when: saas_public_key is defined

- name: Write VM ID
  ansible.builtin.copy:
    dest: /opt/controlclaw/keys/vm_id
    content: "{{ vm_id }}"
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0644'
  when: vm_id is defined

- name: Write the agent hostname
  ansible.builtin.copy:
    dest: /opt/controlclaw/keys/vm_hostname
    content: "{{ vm_hostname }}"
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0644'
  when: vm_hostname is defined

- name: Write config API URL
  ansible.builtin.copy:
    dest: /opt/controlclaw/keys/config_api_url
    content: "{{ config_api_url }}"
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0644'
  when: config_api_url is defined

- name: Write ready API URL
  ansible.builtin.copy:
    dest: /opt/controlclaw/keys/ready_api_url
    content: "{{ ready_api_url }}"
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0644'
  when: ready_api_url is defined

# On-box keygen (secured boxes): instead of a shipped private key, the agent generates its OWN
# keypair and registers the public key using this one-time bootstrap token. Legacy boxes get
# vm_private_key.pem above and no token (the agent then skips registration).
- name: Write bootstrap token (one-time pubkey registration)
  ansible.builtin.copy:
    dest: /opt/controlclaw/keys/bootstrap_token
    content: "{{ vm_bootstrap_token }}"
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0600'
  when: vm_bootstrap_token is defined and vm_bootstrap_token | length > 0
  no_log: true

- name: Write register API URL
  ansible.builtin.copy:
    dest: /opt/controlclaw/keys/register_api_url
    content: "{{ register_api_url }}"
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0644'
  when: register_api_url is defined and register_api_url | length > 0

# One rsync, not `copy` (one module call per file: 40 s on a fast box and 95 s on a cx23 for its 127
# files, in every pass). The same result: files 0644 and folders 0755, the box user's, also for files
# that are there already (-p -o -g), nothing removed that the bundle no longer has. --checksum compares
# contents as `copy` did, not size and time: a fresh checkout has new times, and must not count as a
# change (it would restart the agent). "changed" when rsync changed something.
- name: Copy vm-agent package files
  ansible.builtin.command: >-
    rsync -rlt -p -o -g --checksum --itemize-changes --chown={{ controlclaw_user }}:{{ controlclaw_user }}
    --chmod=D0755,F0644 {{ role_path }}/files/vm-agent/ /opt/controlclaw/agent/
  register: vm_agent_files
  changed_when: vm_agent_files.stdout | length > 0
  when: not cc_skip.vm_agent | default(false) | bool
  notify: restart controlclaw-agent

# The template runner (controlclaw packages/templates) is one more file of the vm-agent bundle.
# `cc-runbook` applies an agent template; `cc-ensure <kind> …` does one step by hand. Both run as
# the box user and need no privilege of their own. The short name is not `cc`: that is the C
# compiler, and a file of that name in /usr/local/bin would break every native npm build.
- name: Put the template runner on the PATH (cc-runbook, cc-ensure)
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item.name }}"
    content: |
      #!/bin/sh
      exec /usr/bin/node /opt/controlclaw/agent/dist/cc-runbook.js {{ item.args }}"$@"
    owner: root
    group: root
    mode: '0755'
  loop:
    - { name: cc-runbook, args: '' }
    - { name: cc-ensure, args: 'ensure ' }
  when: box_role == 'openclaw'

- name: The agent's Rust build
  ansible.builtin.include_tasks:
    file: rust-runtime.yml
    apply:
      tags: [cc-rust]
  tags: [cc-rust]
  vars:
    rust_components:
      - unit: controlclaw-agent
        bin: vm-agent
        migrate_role: agent

# The Rust binary picks the brain entry from CC_SERVICE.
- name: Create controlclaw-agent systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/controlclaw-agent.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=ControlClaw VM Agent
      After=network.target

      [Service]
      Type=simple
      User={{ controlclaw_user }}
      # A brain runs the same binary with CC_SERVICE=gbrain: the box lifecycle routes for GBrain's
      # unit and nothing of OpenClaw's.
      ExecStart={{ cc_rust_dir }}/vm-agent
      Restart=always
      RestartSec=10
      Environment=HOME={{ controlclaw_home }}
      Environment=KEYS_DIR=/opt/controlclaw/keys
      Environment=AGENT_PORT={{ vm_agent_port }}
      # The old port, same routes, for whatever still dials it. Empty turns it off.
      Environment=AGENT_LEGACY_PORT={{ vm_agent_legacy_port }}
      Environment=AGENT_BIND=127.0.0.1
      Environment=STATE_DIR=/opt/controlclaw/state
      # The agent keeps one socket to the local OpenClaw gateway: audit ledger shipping and the
      # approvals bridge (exec / plugin / system-agent approvals <-> the ControlClaw queue).
      Environment=OPENCLAW_GATEWAY_PORT={{ openclaw_gateway_port }}
      # The unit Start / Stop / Restart / Logs act on.
      Environment=CC_SERVICE={{ 'gbrain' if box_role == 'gbrain' else 'openclaw' }}
      {% if mitm_box_private_ip is defined and mitm_box_private_ip | length > 0 %}
      # Behind the org firewall every request it inspects is signed by its CA. The agent adds this
      # file to the roots it trusts (T-88), and the OpenClaw CLIs it runs, which are Node and do not
      # read the OS trust store that cc-install-ca writes to, inherit it. On the first boot the file
      # does not exist yet; the agent trusts the CA in-process once it has installed it.
      Environment=NODE_EXTRA_CA_CERTS={{ mitm_ca_path }}
      {% endif %}

      [Install]
      WantedBy=multi-user.target
  notify: restart controlclaw-agent
  tags: [cc-rust]

# A box the Node fallback put back on Node has a drop-in naming the Node command line. The unit
# above runs Rust; the drop-in would override it.
- name: The Node fallback's drop-in goes
  ansible.builtin.file:
    path: /etc/systemd/system/controlclaw-agent.service.d/50-runtime-fallback.conf
    state: absent
  notify: restart controlclaw-agent
  tags: [cc-rust]

# 3100 is loopback-only: the control plane reaches the vm-agent through Caddy on 443
# (/__cc/agent/*). Boxes provisioned before this had a public 3100 rule; drop it.
- name: Remove the legacy public 3100 UFW rule
  community.general.ufw:
    rule: allow
    port: '3100'
    proto: tcp
    delete: true

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  tags: [cc-rust]

- name: What only the old units could start goes
  ansible.builtin.include_tasks:
    file: rust-runtime-cleanup.yml
    apply:
      tags: [cc-rust]
  tags: [cc-rust]

# The agent is NOT started here: see vm-agent-start.yml, which main.yml includes as the last step
# of an agent box. Starting it is what confines the box to the org firewall.
