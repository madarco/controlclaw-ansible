# Chief of staff: a work routine for one person (the note says who).
name: chief-of-staff
description: A work routine for one person.

todo:
  - id: google
    title: Connect Google
    why: It reads the calendar and mail to write the morning brief and sort the inbox.
    go: connect-google
  - id: channel
    title: Connect a channel
    why: You get the morning brief and its questions there.
    go: connect-channel
  - id: meetings
    title: Turn on Meetings
    why: It joins meetings from the calendar, stays quiet and sends you the notes.
    go: turn-on-meetings
  - id: email-allowed
    title: Let it email the person it works for and your company
    why: It asks you before it emails anyone else.
    go: email-rules
  - id: tickets
    title: Connect Linear or another ticketing tool
    why: It reads and updates your tickets.
    go: connect-app
    optional: true

steps:
  - id: soul
    title: Write the agent's instructions
    file: { path: SOUL.md, from: files/SOUL.md, ifMissing: true, fill: true }

  - id: agents
    title: Write how the agent works
    file: { path: AGENTS.md, from: files/AGENTS.md, ifMissing: true, fill: true }

  - id: controlclaw-tools
    title: Let the agent read its ControlClaw settings, not change them
    controlclaw.setting: { tool: agent_tools_set_mode, values: { mode: read } }

  - id: email
    title: Ask before the agent emails anyone new
    controlclaw.setting: { tool: email_set_agent_outbound, values: { mode: ask } }

  - id: morning-brief
    title: Schedule the morning brief at 08:00
    openclaw.schedule:
      name: morning-brief
      cron: "0 8 * * *"
      message: "Morning brief: today's calendar, what in the inbox needs an answer, and what is still open from yesterday. Keep it short."
