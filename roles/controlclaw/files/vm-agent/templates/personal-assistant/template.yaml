# Personal assistant: one person's general helper. It answers anything, browses and runs tasks.
# docs/plans/agent-templates.md, "System templates".
name: personal-assistant
description: One person's general helper.

# What a person does after the template is applied. Each item names a page of the console (`go`);
# the console ticks an item off by itself where it can tell.
todo:
  - id: channel
    title: Connect a channel
    why: You can message it on Telegram, WhatsApp or Slack.
    go: connect-channel
  - id: meetings
    title: Turn on Meetings
    why: It joins meetings from invites, takes notes and sends reminders.
    go: turn-on-meetings
  - id: email-person
    title: Let it email the person it works for
    why: It asks you before it emails anyone else.
    go: email-rules
  - id: google
    title: Connect Google
    why: It can use the calendar and the inbox.
    go: connect-google
    optional: true
  - id: meet-sign-in
    title: Sign it in to Meet
    why: It joins meetings with its own account, not as a guest.
    go: meet-sign-in
    optional: true
  - id: phone
    title: Give it a phone number
    why: It can answer and make phone calls.
    go: phone-number
    optional: true

steps:
  - id: soul
    title: Write the agent's instructions
    file: { path: SOUL.md, from: files/SOUL.md, ifMissing: true, fill: true }

  - id: agents
    title: Write how the agent works
    file: { path: AGENTS.md, from: files/AGENTS.md, ifMissing: true, fill: true }

  - id: controlclaw-tools
    title: Let the agent read its ControlClaw settings, not change them
    controlclaw.setting: { tool: agent_tools_set_mode, values: { mode: read } }

  - id: email
    title: Ask before the agent emails anyone new
    controlclaw.setting: { tool: email_set_agent_outbound, values: { mode: ask } }
