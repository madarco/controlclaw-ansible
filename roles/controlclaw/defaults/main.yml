---
# ControlClaw default variables

# CI testing mode - skips tasks that require systemd, Docker-in-Docker, or kernel access
ci_test: false

# Tailscale settings
tailscale_enabled: false
tailscale_authkey: ""

# Node.js version
# OpenClaw requires node >=24.16.0 (<25) or >=26.1.0. npm resolves `openclaw@latest`
# against the installed node, so an older node silently installs an older OpenClaw.
nodejs_version: "24.x"

# User settings (will be created as system user)
controlclaw_user: controlclaw
controlclaw_home: /home/controlclaw

# SSH keys for controlclaw user
controlclaw_ssh_keys: []

# The live browser: one headful Chrome on a virtual display, shown in the console over noVNC and
# driven by OpenClaw over CDP. On for every agent box — a customer's saved logins live in that
# Chrome profile and the agent reuses them, so there is nothing to opt into.
#
# It is a default rather than a per-box flag on purpose: cc-reprovision rebuilds its extra-vars
# from what is on disk (files/cc-reprovision), so a flag the control plane passed at create time
# would be lost on the first self-update. The variable stays so a box can still be built without
# the browser (CI, the proxy/mitm roles do not include this file at all).
#
# All three ports are loopback-only; Caddy is the one way in (templates/Caddyfile.j2).
browser_stream_enabled: true
browser_cdp_port: 9222
browser_vnc_port: 5900
browser_novnc_port: 6080

# The virtual screen. One value: the script sizes Xvfb and the Chrome window from it, so they
# cannot drift apart and leave a border of dead space around the window.
browser_screen_geometry: "1280x800"

# OpenClaw's own Systems tab, pointed at that same screen.
#
# The gateway reports a desktop for its host when `desktop.host.enabled` is true, and observing
# it means attaching to a loopback VNC server — which OpenClaw REFUSES to do unless the server
# asks for a password ("refusing unauthenticated VNC server"). The console's mirror on
# browser_vnc_port has no password and must not grow one: noVNC would start prompting the
# customer in the Browser tab. So browser-stream.sh runs a SECOND x11vnc over the same display
# :1, password-protected, on this port, and OpenClaw is pointed at that one. The console's path
# is left exactly as it was.
#
# Cost: one more x11vnc inside the browser cgroup's MemoryMax -- 15 MB resident, measured on a
# real box. Both mirrors show the same screen; neither can see anything the other cannot.
openclaw_desktop_enabled: true
browser_desktop_vnc_port: 5901
# Plaintext, read by OpenClaw as the controlclaw user at observe time (desktop.host.passwordFile)
# and handed to the control-UI client that already authenticated to the gateway.
openclaw_desktop_password_file: /opt/controlclaw/keys/desktop_vnc_password
# The same password in x11vnc's obfuscated -rfbauth format. Two files because the two programs
# read two formats; generated together, once, and never rotated.
browser_desktop_rfbauth_file: /opt/controlclaw/keys/desktop_vnc_rfbauth

# What the browser cgroup is allowed. A browser's appetite is set by whatever page someone opens,
# and it shares a 4 GB box with the agent, so it is capped rather than left to the OOM killer's
# judgement — which in practice takes OpenClaw and leaves the browser looking fine. MemoryHigh
# throttles it into swap first; MemoryMax is the wall. Covers Chrome, Xvfb, x11vnc, websockify
# and openbox together (~220 MB of that is everything except Chrome).
browser_memory_high: "1600M"
browser_memory_max: "2G"

# What OpenClaw is pointed at (tasks/openclaw.yml). Written into the config AND compared against
# what is already there, so it is derived once here rather than spelled out twice.
openclaw_cdp_url: "http://127.0.0.1:{{ browser_cdp_port }}"

# OpenClaw drives that Chrome with playwright-core, which announces itself on the CDP wire:
# it turns the Runtime domain on for every page it attaches to, and injects its init scripts
# into the page's own JS world. patchright-core is the same Playwright release with those
# removed, and the same package layout, so tasks/openclaw.yml points OpenClaw's
# `playwright-core` at it instead of replacing any OpenClaw code.
#
# The version must be the playwright-core version OpenClaw itself depends on — patchright
# publishes a build per Playwright release (not for every one of them), and the two are the same
# API only at the same number. openclaw.yml reads OpenClaw's own dependency and, when they
# differ, skips the alias and warns rather than failing the play: `openclaw@latest` is unpinned,
# so a hard stop would take every provisioning box down over a fingerprint. Bumping this is the
# chore that comes with an OpenClaw release that moves Playwright.
patchright_version: "1.63.0"
# Deliberately NOT under /opt/controlclaw: OpenClaw resolves this path as the controlclaw user,
# and that tree is 0750/0700 root-owned in places (it holds keys/). A box where the gateway
# cannot traverse to the package loses its browser tool entirely — seen on a real box before
# this moved. /usr/local/lib is where a locally installed library belongs anyway.
patchright_prefix: /usr/local/lib/controlclaw-patchright

# Swap (tasks/swap.yml). The stock box has none, which leaves the kernel no move under memory
# pressure except to kill something. 0 disables.
swap_size_mb: 4096
swap_file: /swapfile

# Box role: "openclaw" (agent zone, default), "proxy" (blind L4 proxy in front of the agents)
# or "mitm" (secret zone — egress proxy + secrets).
box_role: openclaw

# Open TCP 22 in UFW. Mirrors the Hetzner firewall flag (agent_ssh_debug in Terraform), which
# is the real gate; this keeps the box consistent if the Hetzner firewall is ever detached.
ssh_debug: true

# OpenClaw gateway. Loopback-only by design; Caddy terminates TLS on 443 in front of it and the
# proxy box is the only allowed source. The systemd unit is named `openclaw` because that is
# what the vm-agent drives; do not rename it without changing vm-agent's SERVICE constant.
openclaw_gateway_port: 18789

# Agent hostname and access path (openclaw boxes). vm_hostname is passed per box by the
# control plane (<slug><vm_domain_suffix>); without it Caddy is installed but not configured.
vm_domain_suffix: ".vm.controlclaw.com"
proxy_ip: ""                          # public IP of the proxy box; UFW allows 80/443 from it only
caddy_acme_email: "ops@controlclaw.com"

# On-demand re-provisioning (self-update.yml). The control plane passes the repo and branch it
# provisioned this box from; cc-reprovision then reads them off disk instead of being told at
# update time, so a compromised control plane cannot redirect a running box at its own repo.
# Empty repo = no pin written and the box simply has no update path.
ansible_repo_url: ""
ansible_branch: "main"
# Pull branch HEAD instead of the newest commit at least 24h old. For testing an update before
# the repo has branch protection and a review rule behind it; leave false in production.
update_allow_unverified: false

# Proxy box (box_role=proxy)
hcloud_read_token: ""                 # READ-ONLY Hetzner token for route discovery
proxy_routes_interval_sec: 20

# mitm box settings (secret zone)
mitm_proxy_port: 8080
mitm_agent_port: 3100
mitm_private_subnet: "10.0.0.0/16"   # the org private network CIDR
mitm_public_iface: eth0              # public interface to masquerade out of
controlclaw_url: ""                  # ControlClaw base URL (store/rules/permission endpoints)
org_id: ""                           # org this box serves

# Encrypted backups: the object store agent boxes PUT ciphertext to. Passed through the proxy
# uninspected: the body is already encrypted end to end and the authorisation is in the URL.
# Scoped to this one host. Empty disables it, which turns backups off for every box behind
# this firewall. See apps/saas/docs/features/backups.md.
controlclaw_backup_host: "controlclaw-backups.s3.eu-west-1.amazonaws.com"

# App integrations: the OpenConnector runtime on the firewall (tasks/connector.yml). Version and
# digest must match apps/saas/app/(integrations)/lib/connector-catalog.ts in the control plane.
connector_image: "ghcr.io/oomol-lab/open-connector"
connector_image_digest: "sha256:f25207e6f71eabc70182c4f5db5c01db79091d0f4523a7495b35e649d5b6c006"
connector_port: 3910                 # loopback only: the runtime itself
connector_gate_port: 3900            # private IP: the mitm-agent's gate the agent boxes dial
connector_memory_max: 512m

# OpenClaw box egress wiring (set when the org has a mitm box)
mitm_box_private_ip: ""              # private IP of the org mitm box
mitm_ca_cert: ""                     # public CA cert (PEM) to install in the trust store

# Where cc-install-ca puts the org mitm CA. Node ignores the OS trust store, so every task that
# shells out to npm/pnpm points NODE_EXTRA_CA_CERTS at this file when it exists (see main.yml).
mitm_ca_path: /usr/local/share/ca-certificates/controlclaw-mitm.crt
