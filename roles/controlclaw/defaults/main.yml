---
# ControlClaw default variables

# CI testing mode - skips tasks that require systemd, Docker-in-Docker, or kernel access
ci_test: false

# Tailscale settings
tailscale_enabled: false
tailscale_authkey: ""

# Node.js version
# OpenClaw requires node >=24.16.0 (<25) or >=26.1.0. npm resolves `openclaw@latest`
# against the installed node, so an older node silently installs an older OpenClaw.
nodejs_version: "24.x"

# User settings (will be created as system user)
controlclaw_user: controlclaw
controlclaw_home: /home/controlclaw

# SSH keys for controlclaw user
controlclaw_ssh_keys: []

# Browser streaming (Chromium + noVNC)
browser_stream_enabled: false
browser_cdp_port: 9222
browser_vnc_port: 5900
browser_novnc_port: 6080

# Box role: "openclaw" (agent zone, default), "proxy" (blind L4 proxy in front of the agents)
# or "mitm" (secret zone — egress proxy + secrets).
box_role: openclaw

# Open TCP 22 in UFW. Mirrors the Hetzner firewall flag (agent_ssh_debug in Terraform), which
# is the real gate; this keeps the box consistent if the Hetzner firewall is ever detached.
ssh_debug: true

# OpenClaw gateway. Loopback-only by design; Caddy terminates TLS on 443 in front of it and the
# proxy box is the only allowed source. The systemd unit is named `openclaw` because that is
# what the vm-agent drives; do not rename it without changing vm-agent's SERVICE constant.
openclaw_gateway_port: 18789

# Agent hostname and access path (openclaw boxes). vm_hostname is passed per box by the
# control plane (<slug><vm_domain_suffix>); without it Caddy is installed but not configured.
vm_domain_suffix: ".vm.controlclaw.com"
proxy_ip: ""                          # public IP of the proxy box; UFW allows 80/443 from it only
caddy_acme_email: "ops@controlclaw.com"

# On-demand re-provisioning (self-update.yml). The control plane passes the repo and branch it
# provisioned this box from; cc-reprovision then reads them off disk instead of being told at
# update time, so a compromised control plane cannot redirect a running box at its own repo.
# Empty repo = no pin written and the box simply has no update path.
ansible_repo_url: ""
ansible_branch: "main"
# Pull branch HEAD instead of the newest commit at least 24h old. For testing an update before
# the repo has branch protection and a review rule behind it; leave false in production.
update_allow_unverified: false

# Proxy box (box_role=proxy)
hcloud_read_token: ""                 # READ-ONLY Hetzner token for route discovery
proxy_routes_interval_sec: 20

# mitm box settings (secret zone)
mitm_proxy_port: 8080
mitm_agent_port: 3100
mitm_private_subnet: "10.0.0.0/16"   # the org private network CIDR
mitm_public_iface: eth0              # public interface to masquerade out of
controlclaw_url: ""                  # ControlClaw base URL (store/rules/permission endpoints)
org_id: ""                           # org this box serves

# OpenClaw box egress wiring (set when the org has a mitm box)
mitm_box_private_ip: ""              # private IP of the org mitm box
mitm_ca_cert: ""                     # public CA cert (PEM) to install in the trust store

# Where cc-install-ca puts the org mitm CA. Node ignores the OS trust store, so every task that
# shells out to npm/pnpm points NODE_EXTRA_CA_CERTS at this file when it exists (see main.yml).
mitm_ca_path: /usr/local/share/ca-certificates/controlclaw-mitm.crt
