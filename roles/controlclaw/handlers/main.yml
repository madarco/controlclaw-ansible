---
- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: restart controlclaw-mitmproxy
  ansible.builtin.systemd:
    name: controlclaw-mitmproxy
    state: restarted
    daemon_reload: true

- name: restart controlclaw-mitm-agent
  ansible.builtin.systemd:
    name: controlclaw-mitm-agent
    state: restarted
    daemon_reload: true

- name: restart controlclaw-connector
  ansible.builtin.systemd:
    name: controlclaw-connector
    state: restarted
    daemon_reload: true

- name: restart dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted

- name: restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: restart timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted

- name: update ca certificates
  ansible.builtin.command: update-ca-certificates
  changed_when: true

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# try-restart: only a redsocks that is running. Before the vm-agent turns egress on
# (cc-enable-egress) it is not, and must not be started from here.
- name: restart controlclaw-redsocks
  ansible.builtin.shell: systemctl daemon-reload && systemctl try-restart controlclaw-redsocks
  changed_when: true

- name: restart openclaw
  ansible.builtin.systemd:
    name: openclaw
    state: restarted
    daemon_reload: true

# Shared notes (tasks/shared-notes.yml): the search path changed, so the index is stale. After the
# restart above, bring it up to date once, for every agent of this OpenClaw (no --agent). It can
# call the embedding provider, so it has a time limit, and it never fails the play: the gateway
# does the same at the first search of a chat.
- name: bring the memory index up to date
  ansible.builtin.command:
    argv: [timeout, --kill-after=10, "120", /usr/bin/openclaw, memory, status, --index]
  become: true
  become_user: "{{ controlclaw_user }}"
  environment:
    HOME: "{{ controlclaw_home }}"
  register: shared_notes_index
  changed_when: false
  failed_when: false
  listen: index memory after the notes path changed

- name: say when the memory index was not brought up to date
  ansible.builtin.debug:
    msg: "Shared notes: the memory index was not brought up to date (exit {{ shared_notes_index.rc | default('none') }}). OpenClaw does it at the first search."
  when: (shared_notes_index.rc | default(1)) != 0
  listen: index memory after the notes path changed

- name: restart caddy
  ansible.builtin.systemd:
    name: caddy
    state: restarted
    daemon_reload: true

- name: restart controlclaw-exit-relay
  ansible.builtin.systemd:
    name: controlclaw-exit-relay
    state: restarted
    daemon_reload: true

- name: reload haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: reloaded

# Keep this one LAST. Handlers run in the order of this file, and the agent reports ready as soon
# as it is up: OpenClaw and Caddy must have had their restarts by then (see vm-agent-start.yml).
- name: restart controlclaw-agent
  ansible.builtin.systemd:
    name: controlclaw-agent
    state: restarted
    daemon_reload: true

- name: reload systemd for disk encryption
  ansible.builtin.systemd:
    daemon_reload: true
